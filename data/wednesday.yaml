post_workout_notes:
  soreness_prediction: 预期酸痛部位：下腹（24-48 小时，中等强度）、上腹（12-24 小时，轻度）、腹外斜肌（24-36 小时，轻度）。如果下背部酸痛 > 腹部，说明骨盆后倾不足或髂腰肌代偿，下次需降低动作幅度，重新建立骨盆后倾模式。
  recovery_protocol: 核心训练后无需大量碳水补充（核心肌群较小）。训练后 1-2 小时内摄入 20-30g 蛋白质即可。今晚进行 10 分钟腹部泡沫轴松解 + 5 分钟呼吸训练。明天（周四）背部训练，核心完全休息。
  integration_with_weekly_plan: 周三核心训练会巩固周二建立的骨盆后倾能力，同时为周四背部训练（硬拉等动作）建立核心稳定性。核心是所有训练的发力支点，强大的核心会提升所有其他训练的质量和安全性。
biomechanical_rationale:
  why_reverse_crunch:
    reason: 反向卷腹通过骨盆后倾力矩直接对抗骨盆前倾，这是下腹训练的黄金动作。相比传统卷腹（上半身向下半身靠拢），反向卷腹（下半身向上半身靠拢）会更多激活下腹肌，同时减少髂腰肌参与。
    cue_emphasis: 全程想象'用下腹肌拉骨盆向上'而非'用腿甩起来'。如果感到髋前侧发力，说明髂腰肌代偿，需降低幅度。
  why_leg_lower:
    reason: 直腿降落是纯离心训练，离心力量是对抗骨盆前倾的关键。当双腿下放时，重力会试图将骨盆拉向前倾，下腹肌和腹横肌必须对抗这个力矩。这是'测试'核心抗伸展能力的最佳动作。
    safety_note: 这是高难度动作，必须在下背部即将离地的角度停止。如果下背部离地，说明角度过低，会增加腰椎压力。
  why_dead_bug:
    reason: 死虫式是功能性核心训练的基石。它模拟了深蹲、硬拉时核心的工作模式：在四肢移动的同时，保持脊柱稳定。这是'深蹲/硬拉时保护腰椎'的模拟训练。
    progression_path: 第 1-2 周：单手或单腿版本 → 第 3-4 周：对侧手脚版本 → 第 5-6 周：手持轻哑铃版本 → 第 7-8 周：不稳定表面（平衡垫）版本。
  why_plank:
    reason: 平板支撑是核心整合性训练，同时激活腹横肌、腹直肌、臀大肌。骨盆后倾锁定是关键，这会训练核心在等长收缩下的抗伸展能力。这是所有负重训练的安全基础。
    common_mistake: 90% 的人会塌腰（骨盆前倾）。解决方案：主动收缩臀部和下腹肌，想象'尾骨向前卷'。如果无法保持骨盆后倾，改为膝盖支撑版本。
  why_side_plank:
    reason: 侧平板支撑训练核心抗侧屈能力，这是单侧负重（如单臂划船、保加利亚蹲）时保护脊柱的关键。同时会激活臀中肌，这是膝关节稳定的守门员。
    integration: 侧平板支撑会巩固周二建立的臀中肌激活，同时为周四的单臂划船建立抗旋转能力。
active_recovery_mechanisms:
  blood_flow_enhancement: 轻度核心训练（RPE 6-7/10）会促进血液循环，加速周二下肢训练后的代谢废物清除（如乳酸、肌酸激酶）。这是主动恢复的核心机制。
  neural_facilitation: 核心训练会激活深层稳定肌群（腹横肌、多裂肌），这会通过神经反射抑制表层运动肌群（腹直肌、竖脊肌）的过度紧张，促进恢复。
  fascial_integration: 核心训练会激活深前线筋膜（腹横肌 → 骨盆底肌 → 髂腰肌），这会改善筋膜滑动性，减少粘连，促进整体恢复。
  psychological_benefit: 中低强度训练会释放内啡肽，改善情绪，减少训练疲劳感。这是主动恢复的心理机制。
common_compensation_patterns:
  pattern_1_hip_flexor_dominance:
    manifestation: 反向卷腹或直腿降落时，感觉髋前侧发力 > 下腹
    root_cause: 髂腰肌过强 + 下腹肌失活
    immediate_fix: 降低动作幅度至 50%，专注于骨盆后倾
    long_term_solution: 每天执行体态矫正方案中的动作 1（髂腰肌抑制 + 臀大肌激活），持续 4 周
  pattern_2_lower_back_arching:
    manifestation: 任何动作时，下背部离地（骨盆前倾）
    root_cause: 腹横肌失活 + 竖脊肌过强
    immediate_fix: 降低动作幅度，或改为膝盖支撑版本
    long_term_solution: 每天执行 360° 呼吸训练（3 组 × 10 次），持续 4 周
  pattern_3_neck_strain:
    manifestation: 卷腹时，颈部紧张或疼痛
    root_cause: 用手拉头部 + 上腹肌力量不足
    immediate_fix: 双手轻触耳后（不用力拉），或改为双手交叉于胸前
    long_term_solution: 降低卷腹幅度至肩胛骨离地 10cm，逐周增加 2-3cm
  pattern_4_plank_sagging:
    manifestation: 平板支撑时，臀部下沉（塌腰）
    root_cause: 骨盆前倾 + 臀大肌失活
    immediate_fix: 主动收缩臀部和下腹肌，强制骨盆后倾
    long_term_solution: 改为膝盖支撑版本，建立骨盆后倾模式后再进阶
  pattern_5_breath_holding:
    manifestation: 任何动作时憋气，面部涨红
    root_cause: 腹内压调节失控 + 呼吸模式紊乱
    immediate_fix: 降低动作强度至 70%，保持自然呼吸
    long_term_solution: 每天执行 360° 呼吸训练（3 组 × 10 次），建立正确呼吸模式
weekly_integration:
  monday_connection:
    carryover: 周一上肢推训练强调骨盆后倾锁定，周三核心训练会进一步巩固这个模式
    synergy: 如果周一能在上斜卧推时保持骨盆后倾，周三核心训练会更容易执行
  tuesday_connection:
    carryover: 周二下肢训练会导致臀大肌和腘绳肌酸痛，周三轻度核心训练会促进血液循环，加速恢复
    synergy: 周三的蚌式开合和侧平板支撑会继续激活臀中肌，巩固周二建立的稳定性
  thursday_preparation:
    carryover: 周三核心训练会建立强大的核心稳定性，为周四背部训练（硬拉、划船）做准备
    synergy: 周三的死虫式和平板支撑会训练核心抗伸展能力，这是周四硬拉时保护腰椎的关键
  cumulative_effect:
    week_1_2: 建立骨盆后倾的核心控制，可能感到下腹肌'不会用力'
    week_3_4: 骨盆后倾开始自动化，核心训练质量明显提升
    week_5_6: 核心稳定性显著增强，所有其他训练（深蹲、硬拉、卧推）质量提升
    week_7_8: 核心成为稳定支点，自动在所有动作中激活，保护脊柱
safety_protocols:
  red_flags:
    sharp_lower_back_pain:
      description: 任何动作时，下背部尖锐疼痛或放射至臀部/腿部
      action: 立即停止训练，仰卧屈膝放松 10 分钟，48 小时内就医
      prevention: 确保骨盆后倾锁定，下背部始终贴地
    abdominal_cramping:
      description: 腹部持续痉挛或剧烈疼痛
      action: 立即停止训练，仰卧屈膝深呼吸 5 分钟，如持续 > 10 分钟，就医
      prevention: 训练前 2 小时避免大量进食，保持水合
    neck_pain:
      description: 卷腹时，颈部尖锐疼痛或僵硬
      action: 立即停止训练，改为双手交叉于胸前版本
      prevention: 双手轻触耳后（不用力拉），保持颈部中立
  form_checkpoints:
    pre_set_checklist:
      - "[ ] 骨盆后倾锁定（下背部贴地）"
      - "[ ] 360° 呼吸准备（腹横肌激活）"
      - "[ ] 颈部中立（不过度屈曲或伸展）"
      - "[ ] 呼吸模式准备（不憋气）"
    mid_set_monitoring:
      - "[ ] 下背部是否始终贴地？（每次动作自查）"
      - "[ ] 是否感到目标肌群（腹部）发力？"
      - "[ ] 呼吸是否顺畅？（不憋气）"
      - "[ ] 颈部是否放松？（无紧张感）"
    post_set_assessment:
      - "[ ] 腹部酸痛 > 下背部或髋前侧？"
      - "[ ] 颈部无不适？"
      - "[ ] 能否保持相同节奏完成下一组？"
      - "[ ] 如以上任一项为'否'，调整动作或休息更久"
  deload_protocol:
    when_to_deload: 如果连续 2 次训练感到下背部疲劳 > 腹部，或颈部持续不适
    deload_week_structure:
      volume: 减少至 2 组（而非 3-4 组）
      intensity: 降低动作幅度至 60-70%
      tempo: 保持相同节奏（不加快）
      focus: 专注于骨盆后倾和呼吸模式，而非次数
    return_to_normal: Deload 周后，从 80% 强度开始，逐周增加 5-10%
nutrition_timing:
  pre_workout:
    timing: 训练前 60-90 分钟
    composition: 15-20g 蛋白质 + 20-30g 复合碳水（轻量）
    rationale: 核心训练不需要大量能量，轻量进食避免腹部不适
  intra_workout:
    timing: 训练中（如需要）
    composition: 水 + 电解质（无需碳水或 BCAA）
    rationale: 核心训练强度较低，保持水合即可
  post_workout:
    timing: 训练后 1-2 小时
    composition: 20-30g 蛋白质（乳清蛋白/鸡胸肉）
    rationale: 核心肌群较小，无需大量碳水补充糖原
  evening:
    timing: 睡前 60-90 分钟
    composition: 酪蛋白 20g + 镁补剂 300mg
    rationale: 酪蛋白缓释，镁促进肌肉放松和睡眠
recovery_optimization:
  immediate_post_workout:
    foam_rolling_sequence:
      - 1. 竖脊肌胸椎段（3 分钟）：释放核心训练后的紧张
      - 2. 腹外斜肌（2 分钟/侧）：侧卧滚动，释放侧腹紧张
      - 3. 髂腰肌（2 分钟/侧）：仰卧松解，预防骨盆前倾
    static_stretching_sequence:
      - 1. 婴儿式（60 秒）：脊柱全段放松
      - 2. 仰卧脊柱扭转（30 秒/侧）：释放腹外斜肌
      - 3. 猫式拉伸（30 秒）：释放腹直肌
  evening_routine:
    breathing_practice: 睡前执行 5 分钟 360° 呼吸训练（3 组 × 10 次），激活副交感神经，改善睡眠质量
    core_massage: 使用筋膜球松解腹部周围（肋骨下缘、髂骨上缘），每侧 2 分钟
    posture_check: 睡前执行体态矫正方案中的动作 6（婴儿式 + 身体扫描 3 分钟），整合全身觉知
  next_day_monitoring:
    thursday_focus: 周四背部训练会包含硬拉等动作，核心稳定性至关重要。如果周三核心训练后感到下背部疲劳，周四需降低硬拉重量 10-15%
    soreness_assessment: 周四早晨评估腹部酸痛程度。如果酸痛 > 6/10，说明周三训练强度合适。如果酸痛 < 3/10，下次可增加组数或延长顶峰收缩时间
progress_tracking:
  weekly_measurements:
    performance_metrics:
      - 反向卷腹：能否在下背部贴地的前提下完成 12 次？
      - 直腿降落：停止角度是多少？（目标：每 2 周降低 5°）
      - 死虫式：能否在下背部贴地的前提下完成 10 次/侧？
      - 平板支撑：能否保持 45-60 秒且骨盆后倾？
    biomechanical_metrics:
      - 骨盆后倾测试：仰卧屈膝，下背部能否完全压向地面并保持 30 秒？
      - 核心抗伸展测试：死虫式时下背部是否始终贴地？
      - 呼吸模式测试：能否在平板支撑时保持 360° 呼吸？
    visual_assessment:
      - 侧面照：腹部轮廓（是否更平坦？）
      - 正面照：腹肌清晰度（是否更明显？）
      - 侧面照：骨盆位置（前倾角度是否减小？）
  monthly_reassessment:
    performance_goals:
      - 第 1 月：建立骨盆后倾的核心控制，能在所有动作中保持下背部贴地
      - 第 2 月：核心稳定性显著增强，平板支撑时间从 45 秒增加至 60 秒
      - 第 3 月：核心成为稳定支点，自动在所有训练中激活
    biomechanical_goals:
      - 第 1 月：能在核心训练时保持骨盆后倾
      - 第 2 月：能在深蹲、硬拉时自动激活核心
      - 第 3 月：骨盆后倾成为'默认模式'，日常站立时自动保持
    visual_goals:
      - 第 1 月：腹部轮廓更平坦（尤其是下腹）
      - 第 2 月：腹肌上四块开始显现
      - 第 3 月：人鱼线（腹外斜肌下部）开始显现
advanced_variations:
  progression_timeline:
    week_1_4_foundation:
      focus: 建立骨盆后倾的核心控制
      exercises: 基础版本（如本方案）
      intensity: RPE 6-7/10
    week_5_8_intensification:
      focus: 增加负荷和时间
      progressions:
        - 反向卷腹：在脚踝绑沙袋（1-2kg）
        - 直腿降落：停止角度降低至 30°
        - 死虫式：手持轻哑铃（2-3kg）
        - 平板支撑：单腿悬空（交替 10 秒/侧）
        - 侧平板支撑：上侧腿抬起 30°
      intensity: RPE 7-8/10
    week_9_12_advanced:
      focus: 功能性整合和不稳定训练
      progressions:
        - 反向卷腹：在瑞士球上执行
        - 直腿降落：改为悬垂举腿（如有单杠）
        - 死虫式：在平衡垫上执行
        - 平板支撑：双手置于瑞士球上
        - 侧平板支撑：下侧前臂置于平衡垫上
      intensity: RPE 8-9/10
  alternative_exercises:
    if_lower_back_sensitive:
      replace: 直腿降落 → 单腿降落（交替）
      rationale: 降低腰椎负荷，同时保持下腹激活
    if_neck_sensitive:
      replace: 卷腹 → 卷腹（双手置于大腿，滑向膝盖）
      rationale: 消除颈部压力，专注于上腹收缩
    if_time_limited:
      minimal_effective_dose:
        - 反向卷腹（3 组 × 12 次）
        - 死虫式（3 组 × 8 次/侧）
        - 平板支撑（2 组 × 45 秒）
      duration: 15 分钟
      coverage: 覆盖 70% 核心训练效果
integration_with_posture_correction:
  synergy_with_daily_routine:
    morning: 起床后执行体态矫正方案中的动作 1（髂腰肌抑制 + 臀大肌激活 3 分钟），为一天建立骨盆后倾模式
    midday: 午休时执行 360° 呼吸训练（2 组 × 10 次），重新激活核心
    evening: 睡前执行体态矫正方案中的动作 6（婴儿式 + 身体扫描 3 分钟），整合全身觉知
  carryover_to_daily_life:
    sitting_posture: 办公时每小时执行 1 次 360° 呼吸（10 次深呼吸），保持骨盆中立和核心激活
    standing_posture: 站立时主动激活腹横肌（想象'束腰'），保持骨盆后倾
    walking_posture: 行走时保持核心激活，想象'从核心走路'而非'从腿走路'
  long_term_transformation:
    week_1_4: 核心训练建立骨盆后倾的神经模式
    week_5_8: 骨盆后倾开始自动化，日常姿态改善
    week_9_12: 核心成为稳定支点，所有动作质量提升，脊柱健康显著改善
troubleshooting_guide:
  problem_1_no_abdominal_burn:
    symptom: 完成所有动作后，腹部无酸痛感
    possible_causes:
      - 骨盆后倾不足，髂腰肌代偿
      - 动作幅度过小，肌肉张力不足
      - 节奏过快，消除了受张时间
    solutions:
      - 每次动作前先做 3 次骨盆后倾呼吸，建立神经连接
      - 增加动作幅度至 80-90%（在安全范围内）
      - 延长顶峰收缩时间至 4-5 秒
      - 降低速度，严格执行节奏
  problem_2_lower_back_pain:
    symptom: 训练后下背部酸痛或疼痛
    possible_causes:
      - 骨盆前倾，下背部过度伸展
      - 髂腰肌过度参与
      - 动作幅度过大，超出核心控制范围
    solutions:
      - 立即降低所有动作幅度至 50%
      - 每天执行体态矫正方案中的动作 1（髂腰肌抑制 5 分钟）
      - 改为膝盖支撑版本（如平板支撑改为膝盖平板支撑）
      - 如持续 > 3 次训练，就医评估
  problem_3_neck_strain:
    symptom: 卷腹后颈部酸痛或僵硬
    possible_causes:
      - 用手拉头部
      - 上腹肌力量不足，颈部代偿
      - 卷起幅度过大
    solutions:
      - 改为双手交叉于胸前版本
      - 降低卷起幅度至肩胛骨离地 10cm
      - 每次卷起前，主动放松颈部（想象'颈部是柔软的毛巾'）
      - 训练后执行颈部拉伸（前后左右各 20 秒）
  problem_4_cant_hold_plank:
    symptom: 平板支撑无法保持 45 秒
    possible_causes:
      - 核心力量不足
      - 骨盆前倾，臀大肌失活
      - 呼吸模式紊乱（憋气）
    solutions:
      - 改为膝盖平板支撑（降低难度）
      - 主动收缩臀部和下腹肌，强制骨盆后倾
      - 保持 360° 呼吸，不要憋气
      - 从 20 秒开始，每周增加 5 秒
  problem_5_uneven_oblique_development:
    symptom: 左右腹外斜肌发展不对称
    possible_causes:
      - 日常姿态不对称（如久坐时左腿搭右腿）
      - 惯用侧过强
      - 脊柱侧弯
    solutions:
      - 弱侧多做 1 组侧卧髋屈曲和侧平板支撑
      - 日常纠正不对称姿态
      - 每天执行体态矫正方案中的动作 4（脊柱波浪 10 次）
      - 如脊柱侧弯 > 10°，就医评估
mindset_and_execution:
  mental_approach:
    quality_over_quantity: 核心训练重质不重量。宁可做 8 次完美的反向卷腹（骨盆后倾锁定），也不要做 15 次糟糕的（下背部离地）。
    mind_muscle_connection: 每次动作前，用手触摸目标肌群（如下腹），建立触觉反馈。想象'用这块肌肉发力'。
    patience_with_progression: 核心力量的建立需要 6-8 周。不要急于增加负荷，先建立骨盆后倾的神经模式。
    integration_mindset: 核心不是孤立的'六块腹肌'，而是连接上下肢的稳定纽带。强大的核心会提升所有其他训练的质量。
  execution_mantras:
    before_each_set: 骨盆后倾，下背部贴地，核心激活。
    during_movement: 极度缓慢，消除惯性，感受肌肉收缩。
    at_peak_contraction: 挤压，挤压，再挤压。呼气至极限。
    when_fatigued: 当感到无法坚持时，再坚持 3 次。这是成长的时刻。
