id: module_d_core_sculpting_active_recovery_v1
version: 1
title: 模块 D：核心雕刻 + 主动恢复
type: core_training_active_recovery
target_ratio: 下腹 60% | 上腹 40% | 抗旋转/侧屈 补充
duration: 45 分钟
recovery_interval: 48 小时（可在任何模块后 24 小时执行）
core_principle: 骨盆后倾锁定 + 腹横肌激活 + 髂腰肌抑制 + 筋膜整合
intensity_level: 中低强度（RPE 6-7/10）
strategic_positioning: 周三位于周二下肢和周四背部之间，既是核心强化日，也是上下肢的主动恢复日。通过轻度核心训练促进血液循环，加速周二下肢的恢复，同时为周四背部训练建立核心稳定性。
sections:
  warmup:
    - id: w1
      name: 360° 呼吸训练 - 腹横肌激活
      target: 腹横肌（深层核心肌群）+ 骨盆底肌 + 多裂肌
      setup:
        - 仰卧于地面
        - ├─ 双腿：屈膝 90°，双脚踩地
        - ├─ 脚跟距离：距臀部 15cm
        - ├─ 双手：置于腹部两侧（肋骨下缘），感受腹部扩张
        - └─ 骨盆：中立位置（准备后倾）
      cues:
        - "**核心机制：**"
        - "- 360° 呼吸会同时激活腹横肌、骨盆底肌、多裂肌"
        - "- **想象腹部是一个'圆柱形气球'，向四面八方充气**"
        - "- 这是整个核心训练的基础，必须精准执行"
        - ""
        - "**吸气阶段（4 秒）：**"
        - "- 鼻吸气，腹部 360° 扩张"
        - "- **想象气流同时充满腹部的前、后、左、右四个方向**"
        - "- 前侧：腹部向上隆起"
        - "- 后侧：下背部向地面压（轻微）"
        - "- 左右侧：腰两侧向外扩张"
        - "- 感受腹腔内压增加"
        - ""
        - "**呼气阶段（6 秒）：**"
        - "- 口呼气，主动收缩腹横肌"
        - "- **想象肚脐向脊柱靠拢，像拉紧一条腰带**"
        - "- 同时骨盆后倾，下背部压向地面"
        - "- **想象尾骨向前卷，下背部像吸盘一样'粘'在地面上**"
        - "- 感受腹部深层收缩（而非表层腹直肌）"
        - ""
        - "**顶峰挤压（2 秒）：**"
        - "- 在呼气末端，腹横肌完全收缩"
        - "- **想象腹横肌是'天然束腰'，向内收紧腰围**"
        - "- 保持浅呼吸（不憋气）"
        - "- 感受核心深层稳定"
      mistakes:
        - error: 仅腹部前侧扩张
          manifestation: 只感到腹部向上隆起，腰两侧无扩张
          fix: 双手移至腰两侧，感受左右扩张
        - error: 下背部未贴地
          manifestation: 呼气时下背部与地面有空隙
          fix: 延长呼气时间至 8 秒，主动用力压下背部
        - error: 表层腹直肌代偿
          manifestation: 感觉腹部表层收缩，而非深层
          fix: 降低收缩强度至 60%，专注于深层'束腰'感
        - error: 憋气
          manifestation: 顶峰挤压时停止呼吸
          fix: 在顶峰保持浅呼吸，不要完全停止呼吸
      sets_reps: 3 组 × 10 次深呼吸
      tempo: 吸 4 秒-呼 6 秒-挤 2 秒
      muscle_feeling: 腹部深层（腰两侧）收缩感，而非表层
      rest: 30 秒
      progression:
        - 第 1 周：能感受到 360° 扩张
        - 第 2 周：能在呼气时将下背部完全压向地面
        - 第 4 周：能在日常站立时主动激活腹横肌
    - id: w2
      name: 泡沫轴松解竖脊肌（胸椎段）- 释放上肢训练后紧张
      target: 竖脊肌胸椎段（周一上肢训练后的紧张区域）
      setup:
        - 仰卧于地面
        - ├─ 滚轴位置：横向置于胸椎中段（肩胛骨下缘）
        - ├─ 双手：抱头（支撑头部重量）
        - ├─ 臀部：抬离地面（增加压力）
        - └─ 双脚：踩地，膝盖 90°
      cues:
        - "**核心机制：**"
        - "- 周一上肢推训练会导致胸椎竖脊肌紧张"
        - "- **想象这是'清理'周一训练的'残留紧张'**"
        - "- 松解胸椎会改善脊柱活动度，为核心训练做准备"
        - ""
        - "**阶段 1：定位胸椎段**"
        - "- 滚轴置于肩胛骨下缘（胸椎 T7-T10 区域）"
        - "- **想象滚轴压在'背部中段'**"
        - "- 不要滚动腰椎（会加剧骨盆前倾）"
        - ""
        - "**阶段 2：上下滚动**"
        - "- 臀部抬离地面，缓慢上下滚动（10cm 范围）"
        - "- **想象在'扫描'胸椎段，寻找紧绷点**"
        - "- 滚动速度：1cm/秒（极度缓慢）"
        - ""
        - "**阶段 3：定点松解**"
        - "- 遇到紧绷点，静止 30 秒"
        - "- **想象用滚轴'融化'这个紧张的肌肉**"
        - "- 配合深呼吸：吸气时肌肉紧张，呼气时肌肉放松"
      mistakes:
        - error: 滚动腰椎
          manifestation: 滚轴下移至下背部
          fix: 限制滚动范围在肩胛骨下缘至胸椎中段
        - error: 臀部未抬起
          manifestation: 压力不足，无痛感
          fix: 抬高臀部，增加身体重量
        - error: 滚动过快
          manifestation: 无法定位紧绷点
          fix: 放慢速度至 1cm/秒
      sets_reps: 3 分钟
      tempo: 缓慢滚动 + 定点静止 30 秒
      muscle_feeling: 胸椎段酸痛，随后松绑感
      rest: 无
    - id: w3
      name: 猫牛式 - 脊柱波浪 + 骨盆控制
      target: 全脊柱（骨盆-腰椎-胸椎-颈椎）协同控制
      setup:
        - 四足跪姿
        - ├─ 手腕：置于肩部正下方
        - ├─ 膝盖：置于髋部正下方
        - └─ 脊柱：保持中立（准备移动）
      cues:
        - "**核心机制：**"
        - "- 猫牛式建立骨盆-脊柱的协调控制"
        - "- **想象这是'预热'脊柱，为核心训练做准备**"
        - "- 动作必须从骨盆启动（而非腰椎）"
        - ""
        - "**牛式（吸气 3 秒）：**"
        - "- 第 1 秒：骨盆前倾（尾骨向上翘）"
        - "- **想象尾骨是第一个移动的部位**"
        - "- 第 2 秒：腰椎伸展 → 胸椎伸展"
        - "- **想象脊柱逐节打开，像多米诺骨牌**"
        - "- 第 3 秒：头部抬起"
        - ""
        - "**猫式（呼气 4 秒）：**"
        - "- 第 1 秒：骨盆后倾（尾骨向下卷）"
        - "- **想象尾骨藏进两腿之间**"
        - "- 第 2-3 秒：腰椎屈曲 → 胸椎屈曲"
        - "- **想象脊柱逐节卷曲，像卷寿司**"
        - "- 第 4 秒：下巴内收"
      mistakes:
        - error: 腰椎先动（而非骨盆）
          manifestation: 感觉腰部主导动作
          fix: 放慢速度，专注于骨盆先动，脊柱追随
        - error: 整体移动（而非逐节）
          manifestation: 脊柱像僵硬的棍子同时移动
          fix: 放慢速度至每次 10 秒，专注于逐节移动
      sets_reps: 2 组 × 10 次
      tempo: 吸 3 秒（牛式）-呼 4 秒（猫式）
      muscle_feeling: 脊柱全段活动感，无任何部位疼痛
      rest: 30 秒
    - id: w4
      name: 侧卧蚌式 - 臀中肌再激活（主动恢复）
      target: 臀中肌（周二下肢训练后的主动恢复）
      setup:
        - 侧卧于地面
        - ├─ 双腿：屈膝 90°，脚跟并拢
        - ├─ 下侧手臂：屈肘支撑头部
        - ├─ 上侧手：置于髋部（感受臀中肌收缩）
        - └─ 骨盆：保持垂直
      cues:
        - "**核心机制：**"
        - "- 周二下肢训练后，臀中肌可能仍有酸痛"
        - "- **想象这是'唤醒'臀中肌，促进血液循环**"
        - "- 轻负荷激活会加速恢复（而非增加疲劳）"
        - ""
        - "**开合阶段：**"
        - "- 上侧膝盖向外打开 45°"
        - "- **想象用膝盖'推'开一个隐形的阻力**"
        - "- 脚跟保持并拢（不分开）"
        - "- 顶峰静止 2 秒，感受臀部外上侧收缩"
        - ""
        - "**回放阶段：**"
        - "- 缓慢回到起始位置"
        - "- **想象对抗一个向下拉的弹簧**"
      mistakes:
        - error: 骨盆后倒
          manifestation: 躯干向后旋转
          fix: 降低外展幅度至 30°，专注于保持骨盆垂直
        - error: 脚跟分开
          manifestation: 外展时脚跟分离
          fix: 主动夹紧脚跟
      sets_reps: 2 组 × 12 次/侧
      tempo: 开 2 秒-静止 2 秒-合 2 秒
      muscle_feeling: 臀部外上侧轻度收缩感（而非疲劳）
      rest: 30 秒
  strength:
    - id: s1
      name: 仰卧反向卷腹 - 下腹核心动作
      target: 腹直肌下部（下腹）+ 腹横肌
      setup:
        - 仰卧于地面
        - ├─ 双手：压于臀部下方（稳定骨盆）或置于体侧
        - ├─ 双腿：屈膝 90°，小腿平行地面
        - ├─ 骨盆：后倾锁定，下背部压向地面
        - └─ 颈部：保持中立
      cues:
        - "**核心机制：**"
        - "- 反向卷腹通过骨盆后倾力矩对抗前倾"
        - "- **想象这是'训练骨盆后倾'的核心动作**"
        - "- 这是 60% 下腹训练的主动作"
        - ""
        - "**卷起阶段（4 秒）：**"
        - "- 骨盆后倾，下背部压向地面"
        - "- **想象尾骨向前卷，骨盆向肋骨靠拢**"
        - "- 下腹肌主动卷起骨盆，膝盖向胸部靠拢"
        - "- **想象用下腹肌'拉'骨盆向上**"
        - "- 不借助惯性甩起（极度缓慢）"
        - ""
        - "**顶峰收缩（3 秒）：**"
        - "- 在最高点（膝盖接近胸部）静止"
        - "- **想象用下腹肌'挤压'骨盆和肋骨之间的空间**"
        - "- 下腹肌完全收缩"
        - "- 呼气至极限（想象'挤出最后一口气'）"
        - ""
        - "**下放阶段（5 秒）：**"
        - "- 极度缓慢地控制下降"
        - "- **想象对抗一个向下拉的重力**"
        - "- 下背部始终贴地（不能离地）"
        - "- 双脚不触地（保持持续张力）"
        - ""
        - "**转换阶段（2 秒）：**"
        - "- 在最低点保持张力，准备下一次"
        - "- **想象下腹肌像弹簧一样'蓄力'**"
      mistakes:
        - error: 下背部离地（髂腰肌代偿）
          manifestation: 卷起时下背部拱起
          fix: 降低卷起幅度至 50%，专注于保持下背部贴地
        - error: 双腿借助惯性甩起
          manifestation: 卷起速度过快（< 3 秒）
          fix: 放慢速度至 5 秒，消除惯性
        - error: 颈部紧张
          manifestation: 下巴戳向胸口
          fix: 保持颈部中立，视线看向天花板
        - error: 双脚触地
          manifestation: 下放时双脚落地
          fix: 在双脚距地 5cm 处停止，保持张力
      sets_reps: 4 组 × 12 次
      tempo: 卷 4 秒-挤 3 秒-下 5 秒-转 2 秒
      muscle_feeling: 下腹部（肚脐下方）深层酸胀和灼烧
      rest: 60 秒
      progression:
        - 第 1-2 周：能在下背部贴地的前提下完成 10 次
        - 第 3-4 周：能延长顶峰收缩至 4 秒
        - 第 5-8 周：在脚踝绑沙袋（1-2kg）增加负荷
    - id: s2
      name: 仰卧直腿降落 - 离心控制强化
      target: 腹直肌下部 + 腹横肌（离心力量）
      setup:
        - 仰卧于地面
        - ├─ 双手：压于臀部下方或置于体侧
        - ├─ 双腿：垂直向上伸直
        - ├─ 骨盆：后倾锁定，下背部压向地面
        - └─ 膝盖：微屈 10°（保护膝关节）
      cues:
        - "**核心机制：**"
        - "- 这是纯离心训练，重点在于控制下降速度"
        - "- **想象这是'测试'下腹肌对抗重力的能力**"
        - "- 离心力量是对抗骨盆前倾的关键"
        - ""
        - "**下放阶段（6 秒）：**"
        - "- 极度缓慢地下放双腿"
        - "- **想象双腿像'羽毛'一样缓慢飘落**"
        - "- 膝盖保持微屈 10°（不改变角度）"
        - "- 下背部始终压向地面"
        - "- **关键：当感到下背部即将离地时，立即停止**"
        - "- 停止角度通常在 30-45°（因人而异）"
        - ""
        - "**顶峰静止（2 秒）：**"
        - "- 在最低点（下背部即将离地的角度）静止"
        - "- **想象下腹肌和腹横肌'死死顶住'重力**"
        - "- 保持自然呼吸（不憋气）"
        - ""
        - "**回到起始（2 秒）：**"
        - "- 快速回到垂直位置（可借助髂腰肌）"
        - "- **想象这是'重置'阶段，为下一次离心做准备**"
      mistakes:
        - error: 下背部离地
          manifestation: 下放角度过低，下背部拱起
          fix: 在更高角度停止（例如 45° 而非 30°）
        - error: 膝盖角度改变
          manifestation: 下放时膝盖弯曲 > 10°
          fix: 保持膝盖微屈 10°，全程不改变
        - error: 下放速度过快
          manifestation: 下放时间 < 5 秒
          fix: 放慢速度至 7-8 秒，极度缓慢
      sets_reps: 3 组 × 8 次
      tempo: 下 6 秒-静止 2 秒-回 2 秒
      muscle_feeling: 下腹部深层持续收缩感
      rest: 75 秒
      progression:
        - 第 1-2 周：停止角度在 45°
        - 第 3-4 周：停止角度降低至 35°
        - 第 5-8 周：停止角度降低至 30°（极限）
    - id: s3
      name: 死虫式 - 核心抗伸展
      target: 腹横肌 + 腹直肌（核心抗伸展肌群）
      setup:
        - 仰卧于地面
        - ├─ 双手：向上伸直，指向天花板
        - ├─ 双腿：屈膝 90°，小腿平行地面
        - ├─ 骨盆：后倾锁定，下背部压向地面
        - └─ 颈部：保持中立
      cues:
        - "**核心机制：**"
        - "- 死虫式训练核心在动态下的抗伸展能力"
        - "- **想象这是'深蹲/硬拉时保护腰椎'的模拟训练**"
        - "- 下背部贴地是整个动作的锚点，一旦离地，立即停止"
        - ""
        - "**伸展阶段（4 秒）：**"
        - "- 对侧手脚同时极度缓慢地伸展"
        - "- 右手向头顶伸展，左腿向前伸展（距地 10cm）"
        - "- **想象手脚被两根弹簧向相反方向拉**"
        - "- 伸展过程中，下背部必须保持贴地"
        - "- **关键：如果感到下背部即将离地，立即停止伸展**"
        - ""
        - "**顶峰静止（2 秒）：**"
        - "- 在完全伸展位置静止"
        - "- **想象全身像一根拉紧的弓弦**"
        - "- 保持自然呼吸（不憋气）"
        - "- 感受腹横肌深层收缩"
        - ""
        - "**回到起始（4 秒）：**"
        - "- 极度缓慢地回到起始位置"
        - "- **想象对抗两根向外拉的弹簧**"
        - ""
        - "**转换阶段（1 秒）：**"
        - "- 换对侧（左手-右腿）"
      mistakes:
        - error: 下背部离地（核心失控）
          manifestation: 伸展时下背部拱起
          fix: 降低伸展幅度至 50%，或改为单手/单腿版本
        - error: 髂腰肌代偿
          manifestation: 髋前侧紧张或疼痛
          fix: 降低腿部伸展高度至 20cm
        - error: 颈部紧张
          manifestation: 下巴戳向胸口
          fix: 保持颈部中立，视线看向天花板
        - error: 速度过快
          manifestation: 伸展时间 < 3 秒
          fix: 放慢速度至 5 秒
      sets_reps: 4 组 × 10 次/侧（左右交替，共 20 次）
      tempo: 伸 4 秒-静止 2 秒-回 4 秒-转 1 秒
      muscle_feeling: 腹部深层持续收缩感
      rest: 60 秒
      progression:
        - 第 1-2 周：能在下背部贴地的前提下完成 8 次/侧
        - 第 3-4 周：能完成 10 次/侧
        - 第 5-8 周：在手中握轻哑铃（2-3kg）增加难度
    - id: s4
      name: 卷腹 - 上腹雕刻
      target: 腹直肌上部（上腹）
      setup:
        - 仰卧于地面
        - ├─ 双腿：屈膝，双脚踩地
        - ├─ 双手：置于耳后（不抱头）或交叉于胸前
        - ├─ 骨盆：后倾锁定，下背部压向地面
        - └─ 颈部：保持中立
      cues:
        - "**核心机制：**"
        - "- 卷腹孤立上腹肌，打造清晰的腹肌上四块"
        - "- **想象这是'雕刻'上腹的精准动作**"
        - "- 幅度小但挤压感强"
        - ""
        - "**卷起阶段（3 秒）：**"
