        - error: 膝盖过度弯曲（变成深蹲）
          manifestation: 下放时膝盖弯曲 > 30°
          fix: 膝盖保持微屈 10-15°，专注于髋关节铰链
        - error: 杠铃离开身体
          manifestation: 下放时杠铃向前飘移
