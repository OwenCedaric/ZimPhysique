id: module_c_lower_body_pelvic_correction_v1
version: 1
title: 模块 C：下肢力学重建 + 骨盆中立化
type: strength_training
target_ratio: 臀大肌 40% | 股四头肌 30% | 腘绳肌 20% | 臀中肌 10%
duration: 60 分钟
recovery_interval: 72 小时（下肢训练恢复周期）
core_principle: 骨盆后倾锁定 + 髋关节主导 + 膝关节追随 + 浅背线激活
strategic_importance: 这是整个训练体系的地基。骨盆位置决定脊柱排列，脊柱排列决定肩部位置，肩部位置决定头部位置，头部位置决定面部张力。
sections:
  warmup:
    - id: w1
      name: 泡沫轴松解髂腰肌（仰卧版）- 解锁骨盆后倾
      target: 髂腰肌（骨盆前倾的主要元凶）
      setup:
        - 仰卧于地面
        - ├─ 滚轴位置：横向置于髋前（肚脐与耻骨连线的中点）
        - ├─ 双腿：自然伸直，放松
        - ├─ 身体重量：完全压在滚轴上
        - └─ 双手：置于体侧或头部下方
      cues:
        - "**阶段 1：寻找紧绷区域**"
        - "- 身体左右缓慢滚动（10cm 范围）"
        - "- **想象在髋前区域'扫描'紧张的肌肉**"
        - "- 找到那个让你'想躲'的紧绷点"
        - ""
        - "**阶段 2：定点松解**"
        - "- 压住紧绷点不动，保持 30 秒"
        - "- **想象用滚轴'融化'这个紧张的肌肉**"
        - "- 配合深呼吸：吸气时肌肉紧张，呼气时肌肉放松"
        - "- 每次呼气时，想象紧张感像冰块一样融化"
        - ""
        - "**阶段 3：动态释放**"
        - "- 保持压力，同侧腿缓慢屈伸（膝盖向胸部靠拢，再伸直）"
        - "- **想象把粘连的髂腰肌'撕'开**"
        - "- 重复 5-8 次"
      mistakes:
        - error: 位置过低
          manifestation: 按压到腹部或耻骨
          fix: 向上移动至肚脐下方 5-8cm
        - error: 压力不足
          manifestation: 无痛感或仅有轻微不适
          fix: 增加身体重量，或将对侧腿屈膝增加压力
        - error: 呼吸停止
          manifestation: 憋气，面部涨红
          fix: 保持自然呼吸，不要过度用力
      sets_reps: 单侧 3 分钟（左右各 1.5 分钟）
      tempo: 缓慢滚动 + 定点静止 30 秒 + 动态释放
      muscle_feeling: 髋前侧深层酸痛，随后紧张感消失
      rest: 无
    - id: w2
      name: 股直肌静态拉伸（跪姿 + 后脚背贴墙）- 释放骨盆前拉力
      target: 股直肌（股四头肌中唯一跨越髋关节的肌肉）
      setup:
        - 单腿跪姿于瑜伽垫
        - ├─ 后侧腿：脚背贴墙，膝盖距墙 10cm
        - ├─ 前侧腿：屈膝 90°，脚掌平踩地面
        - ├─ 双手：叉腰或扶固定物保持平衡
        - └─ 躯干：保持直立
      cues:
        - "**阶段 1：建立拉伸位置**"
        - "- 后侧脚背完全贴墙"
        - "- **想象脚背被'粘'在墙上**"
        - "- 前侧脚掌平踩地面，膝盖 90°"
        - ""
        - "**阶段 2：骨盆后倾激活**"
        - "- 主动收缩臀部和下腹肌"
        - "- **想象尾骨向前卷，骨盆从前倾旋转至后倾**"
        - "- 感受后侧大腿前侧强烈拉伸"
        - "- 拉伸强度：感受大腿前侧深层牵拉（疼痛 6-7/10）"
        - ""
        - "**阶段 3：保持与深化**"
        - "- 保持骨盆后倾，躯干保持直立（不前倾也不后仰）"
        - "- **想象躯干是一根垂直的柱子**"
        - "- 进行 4 次深呼吸，每次呼气时骨盆后倾加深 1-2mm"
      mistakes:
        - error: 腰椎过度伸展
          manifestation: 下背部过度拱起（塌腰）
          fix: 收紧臀部和下腹肌，主动骨盆后倾
        - error: 躯干前倾
          manifestation: 上半身向前倾斜
          fix: 保持躯干垂直，想象头顶有根线向上拉
        - error: 前侧膝盖内扣
          manifestation: 前侧膝盖向内倒
          fix: 主动推膝盖向外，与脚尖同向
      sets_reps: 2 组 × 45 秒/侧
      tempo: 静态保持 + 深呼吸
      muscle_feeling: 后侧大腿前侧深层拉伸感
      rest: 30 秒
    - id: w3
      name: 臀桥激活（单腿顶峰收缩版）- 唤醒沉睡的臀大肌
      target: 臀大肌（骨盆后倾的主力肌群）
      setup:
        - 仰卧于地面
        - ├─ 训练侧腿：脚掌平踩地面，膝盖 90°，脚跟距臀部 15cm
        - ├─ 非训练侧腿：伸直悬空，与地面成 45°
        - ├─ 双手：置于臀部两侧（感受臀大肌收缩）
        - └─ 颈部：保持中立或垫薄枕头
      cues:
        - "**阶段 1：神经唤醒**"
        - "- 用手拍打训练侧臀部 5-8 次"
        - "- **想象在'唤醒'这块沉睡的肌肉**"
        - "- 建立神经-肌肉连接"
        - ""
        - "**阶段 2：推起发力**"
        - "- 推起 2 秒：用臀大肌（而非下背部）推起骨盆"
        - "- **想象用屁股把骨盆向上顶**"
        - "- 推起至肩-髋-膝成一直线"
        - "- 骨盆后倾锁定（尾骨向前卷）"
        - ""
        - "**阶段 3：顶峰挤压**"
        - "- 顶峰挤压 3 秒：臀大肌完全收缩"
        - "- **想象夹紧臀部中间的硬币，用力到发抖**"
        - "- 感受臀大肌深层收缩"
        - ""
        - "**阶段 4：控制下放**"
        - "- 下放 3 秒：极度缓慢地控制下降"
        - "- **想象对抗一个向下拉的弹簧**"
        - "- 下放至臀部距地面 2cm（不触地，保持张力）"
      mistakes:
        - error: 下背部借力
          manifestation: 推起时感到下背部发力或疼痛
          fix: 降低推起高度至 50%，专注于臀部挤压感
        - error: 骨盆未后倾
          manifestation: 顶端腰椎过度伸展（塌腰）
          fix: 主动收缩下腹肌，尾骨向前卷
        - error: 非训练侧腿下落
          manifestation: 悬空腿无法保持 45°
          fix: 降低悬空腿高度至 30°，或改为双腿版本
      sets_reps: 2 组 × 10 次/侧（每次顶峰静止 3 秒）
      tempo: 推 2 秒-挤 3 秒-下 3 秒
      muscle_feeling: 臀大肌深层酸胀和灼烧感
      rest: 45 秒
      progression:
        - 第 1 周：能清晰感受臀大肌收缩（而非下背部）
        - 第 2 周：能在顶峰保持 3 秒且臀部不颤抖
        - 第 4 周：在臀部上放置哑铃（5-10kg）增加负荷
    - id: w4
      name: 蚌式开合 + 弹力带（臀中肌激活）- 稳定膝关节
      target: 臀中肌（防止膝盖内扣的关键肌群）
      setup:
        - 侧卧于地面
        - ├─ 弹力带：套于膝盖上方 10cm
        - ├─ 双腿：屈膝 90°，脚跟并拢
        - ├─ 下侧手臂：屈肘支撑头部
        - ├─ 上侧手：置于髋部（感受臀中肌收缩）
        - └─ 骨盆：保持垂直（不向后倒）
      cues:
        - "**阶段 1：锁定骨盆**"
        - "- 骨盆保持垂直，躯干不旋转"
        - "- **想象骨盆被'固定'在一个垂直平面上**"
        - "- 这是整个动作的锚点"
        - ""
        - "**阶段 2：膝盖外展**"
        - "- 上侧膝盖向外打开（髋外旋 + 外展）"
        - "- **想象用膝盖'推'开弹力带**"
        - "- 脚跟保持并拢（不分开）"
        - "- 打开至最大幅度（通常 45-60°）"
        - ""
        - "**阶段 3：顶峰收缩**"
        - "- 顶峰静止 2 秒"
        - "- **想象用臀部外上侧'夹'住一个球**"
        - "- 感受臀部外上侧（臀中肌）强烈收缩"
        - ""
        - "**阶段 4：控制回放**"
        - "- 缓慢回到起始位置"
        - "- **想象对抗弹力带的拉力**"
      mistakes:
        - error: 骨盆后倒
          manifestation: 躯干向后旋转
          fix: 降低弹力带阻力，专注于保持骨盆垂直
        - error: 脚跟分开
          manifestation: 外展时脚跟分离
          fix: 主动夹紧脚跟，想象脚跟被胶水粘住
        - error: 股四头肌代偿
          manifestation: 大腿前侧发力
          fix: 降低外展幅度至 30°，专注于臀部外侧收缩
      sets_reps: 2 组 × 15 次/侧
      tempo: 开 2 秒-静止 2 秒-合 2 秒
      muscle_feeling: 臀部外上侧（臀中肌）酸胀和灼烧
      rest: 30 秒
    - id: w5
      name: 死虫式（核心抗伸展）- 建立核心稳定性
      target: 腹横肌、腹直肌（核心抗伸展肌群）
      setup:
        - 仰卧于地面
        - ├─ 双手：向上伸直，指向天花板
        - ├─ 双腿：屈膝 90°，小腿平行地面
        - ├─ 骨盆：后倾锁定，下背部压向地面
        - └─ 颈部：保持中立
      cues:
        - "**阶段 1：建立核心锚点**"
        - "- 骨盆后倾，下背部压向地面"
        - "- **想象下背部像吸盘一样'粘'在地面上**"
        - "- 这是整个动作的核心，一旦下背部离地，立即停止"
        - ""
        - "**阶段 2：对侧伸展**"
        - "- 对侧手脚同时极度缓慢地伸展"
        - "- 右手向头顶伸展，左腿向前伸展（距地面 10cm）"
        - "- **想象手脚被两根弹簧向相反方向拉**"
        - "- 伸展过程中，下背部必须保持贴地"
        - ""
        - "**阶段 3：顶峰保持**"
        - "- 在完全伸展位置保持 2 秒"
        - "- **想象全身像一根拉紧的弓弦**"
        - "- 保持自然呼吸（不憋气）"
        - ""
        - "**阶段 4：回到起始**"
        - "- 极度缓慢地回到起始位置"
        - "- **想象对抗两根向外拉的弹簧**"
      mistakes:
        - error: 下背部离地（核心失控）
          manifestation: 下背部与地面有空隙
          fix: 降低伸展幅度至 50%，或改为单手/单腿版本
        - error: 髂腰肌代偿
          manifestation: 髋前侧紧张或疼痛
          fix: 降低腿部伸展高度至 20cm
        - error: 颈部紧张
          manifestation: 下巴戳向胸口
          fix: 保持颈部中立，视线看向天花板
      sets_reps: 2 组 × 8 次/侧（左右交替，共 16 次）
      tempo: 伸展 3 秒-保持 2 秒-回放 3 秒
      muscle_feeling: 腹部深层持续收缩感
      rest: 30 秒
  strength:
    - id: s1
      name: 高脚杯深蹲（骨盆后倾锁定版）- 核心动作
      target: 臀大肌（40%）+ 股四头肌（30%）+ 核心稳定
      setup:
        - 站姿
        - ├─ 双手：在胸前抱住哑铃（垂直握持，像抱杯子）
        - ├─ 双脚：与肩同宽，脚尖外展 15°
        - ├─ 脚跟垫高：杠铃片或木板（高度 2-3cm）
        - │   └─ 目的：强制膝盖前移，减少髋屈需求，降低髂腰肌参与
        - └─ 骨盆：中立位置（准备后倾）
      cues:
        - "**核心机制：**"
        - "- 高脚杯握法会自动激活核心"
        - "- **想象哑铃是一个'重物'，你要用核心'抱'住它**"
        - "- 脚跟垫高会改变力学角度，减少髂腰肌代偿"
        - ""
        - "**下蹲阶段（3 秒）：**"
        - "- 吸气，骨盆后倾锁定（尾骨向前卷）"
        - "- **想象尾骨藏进两腿之间**"
        - "- 膝盖向前推（而非向外开）"
        - "- **想象膝盖要'推'过脚尖（但不实际超过）**"
        - "- 下蹲至大腿平行地面（或略低于平行）"
        - "- 躯干保持直立（不过度前倾）"
        - ""
        - "**顶峰静止（2 秒）：**"
        - "- 在最低点保持张力"
        - "- **想象在最低点'蓄力'，准备爆发**"
        - "- 感受股四头肌和臀大肌共同发力"
        - "- 骨盆保持后倾（下背部不拱起）"
        - ""
        - "**推起阶段（4 秒）：**"
        - "- 呼气，用脚跟蹬地（而非脚尖）"
        - "- **想象用脚跟'踩穿'地板**"
        - "- 臀大肌主导推起（而非股四头肌）"
        - "- **想象用屁股把身体'推'起来**"
        - "- 膝盖与脚尖同向（不内扣也不过度外展）"
        - ""
        - "**顶峰挤压（1 秒）：**"
        - "- 站直时臀部前顶"
        - "- **想象用臀部'推'骨盆向前**"
        - "- 骨盆后倾，挤压臀大肌"
        - "- 膝盖不锁死（保持微屈）"
      mistakes:
        - error: 骨盆前倾（塌腰）
          manifestation: 下蹲时下背部过度拱起
          fix: 降低重量 30%，主动收缩臀部和下腹肌，强制骨盆后倾
        - error: 膝盖内扣
          manifestation: 下蹲时膝盖向内倒
          fix: 降低重量，增加弹力带套于膝盖上方，主动推膝盖向外
        - error: 躯干过度前倾
          manifestation: 下蹲时上半身过度前倾（> 45°）
          fix: 增加脚跟垫高至 4-5cm，降低重量
        - error: 脚跟离地
          manifestation: 下蹲时脚跟抬起
          fix: 增加脚跟垫高，或改善踝关节活动度
        - error: 下背部压力
          manifestation: 下蹲或推起时下背部疼痛
          fix: 立即停止，降低重量 50%，重新建立骨盆后倾模式
      sets_reps: 4 组 × 10 次
      tempo: 下 3 秒-静止 2 秒-推 4 秒-挤 1 秒
      muscle_feeling: 臀大肌和股四头肌同时酸胀，下背部无压力
      rest: 90 秒
      weight_selection:
        method: 能严格维持骨盆后倾完成 10 次，RIR = 2
        first_time_estimate: 体重 62kg，建议哑铃 10-16kg
        progression: 每 2 周评估：能否增加 2kg 且保持骨盆后倾？
      progression:
        - 第 1-2 周：建立骨盆后倾的深蹲模式，重量次要
        - 第 3-4 周：在保持节奏的前提下，每组增加 2kg
        - 第 5-8 周：引入暂停深蹲（顶峰静止 3 秒而非 2 秒）
    - id: s2
      name: 保加利亚分腿蹲（后脚抬高 30cm）- 单侧强化
      target: 臀大肌 + 股四头肌 + 臀中肌（单侧稳定）
      setup:
        - 站姿于卧推凳前
        - ├─ 后侧脚背：置于卧推凳（30cm 高）
        - ├─ 前侧脚：距凳 60-80cm（根据腿长调整）
        - ├─ 双手：持哑铃于体侧
        - └─ 躯干：保持直立
      cues:
        - "**核心机制：**"
        - "- 单侧训练会暴露左右不平衡"
        - "- **想象这是一个'诊断工具'，找出弱侧**"
        - "- 后脚抬高会增加前侧腿的负荷"
        - ""
        - "**下蹲阶段（3 秒）：**"
        - "- 骨盆后倾锁定"
        - "- **想象尾骨向前卷**"
        - "- 躯干保持直立（不前倾）"
        - "- **想象躯干是一根垂直的柱子**"
        - "- 前侧膝盖向前推"
        - "- **想象膝盖要'推'过脚尖**"
        - "- 下蹲至后侧膝盖接近地面（距地 5cm）"
        - ""
        - "**顶峰拉伸（2 秒）：**"
        - "- 在最低点静止"
        - "- **想象前侧臀大肌和股四头肌被'拉长'**"
        - "- 感受前侧腿深层拉伸"
        - ""
        - "**推起阶段（4 秒）：**"
        - "- 用前侧脚跟蹬地"
        - "- **想象用前侧脚跟'踩穿'地板**"
        - "- 臀大肌主导推起"
        - "- **想象用前侧屁股把身体'推'起来**"
        - ""
        - "**顶峰挤压（1 秒）：**"
        - "- 站直时前侧臀部收紧"
        - "- **想象用前侧臀部'挤压'一个球**"
      mistakes:
        - error: 前侧膝盖内扣
          manifestation: 下蹲时膝盖向内倒
          fix: 降低重量 40%，增加弹力带套于膝盖上方，主动推膝盖向外
        - error: 躯干前倾
          manifestation: 下蹲时上半身过度前倾
          fix: 降低重量，专注于保持躯干直立
        - error: 后侧腿过度发力
          manifestation: 感觉后侧腿在'推'
          fix: 后侧腿仅用于平衡，90% 重量在前侧腿
        - error: 平衡困难
          manifestation: 身体左右摇晃
          fix: 降低重量，或非训练侧手扶固定物
      sets_reps: 3 组 × 8 次/侧
      tempo: 下 3 秒-拉伸 2 秒-推 4 秒-挤 1 秒
      muscle_feeling: 前侧臀大肌和股四头肌深层酸胀
      rest: 75 秒
      weight_selection:
        method: 能严格保持躯干直立完成 8 次，RIR = 2
        first_time_estimate: 体重 62kg，建议单只哑铃 6-12kg
        progression: 每 2 周评估：弱侧能否追上强侧？
      progression:
        - 第 1-2 周：识别弱侧（通常是左腿），弱侧多做 1 组
        - 第 3-4 周：在保持节奏的前提下，每组增加 2kg
        - 第 5-8 周：引入暂停版本（顶峰拉伸 3 秒而非 2 秒）
    - id: s3
      name: 罗马尼亚硬拉（骨盆中立版）- 后链强化
