          fix: 全程保持肩胛骨后缩下沉
      sets_reps: 4 组 × 10 次
      tempo: 下 3 秒-拉伸 2 秒-推 4 秒-挤 1 秒
      muscle_feeling: 大腿后侧（腘绳肌）深层拉伸感 + 臀大肌收缩感
      rest: 90 秒
      weight_selection:
