        first_time_estimate: 体重 62kg，建议杠铃 20-30kg 或单只哑铃 8-14kg
        progression: 每 2 周评估：能否增加 2-4kg 且保持脊柱中立？
      progression:
        - 第 1-2 周：建立髋关节铰链模式，重量次要
        - 第 3-4 周：在保持节奏的前提下，每组增加 2-4kg
        - 第 5-8 周：引入单腿版本（更高难度）
    - id: s4
