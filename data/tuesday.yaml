post_workout_notes:
  soreness_prediction: 预期酸痛部位：臀大肌（48-72 小时，最强烈）、股四头肌（36-60 小时）、腘绳肌（24-48 小时）。如果下背部酸痛 > 臀腿，说明骨盆后倾不足，下次需降低重量，重新建立骨盆后倾模式。
  recovery_protocol: 训练后 2 小时内摄入 60g 碳水 + 30g 蛋白质（下肢训练需要更多碳水）。今晚进行 20 分钟泡沫轴松解（重点：臀部、大腿前后侧、小腿）+ 10 分钟足底松解。明天（周三）核心训练，下肢完全休息。
  pelvic_assessment: 每周评估骨盆位置：仰卧屈膝，尝试将下背部完全压向地面。如果能轻松做到且保持 30 秒，说明骨盆后倾能力改善。目标：4 周后能在负重深蹲时自动保持骨盆后倾。
  progression_strategy: 每 2 周评估：(1) 高脚杯深蹲能否增加 2kg 且保持骨盆后倾？(2) 保加利亚分腿蹲时膝盖是否不再内扣？(3) 臀大肌酸痛是否 > 下背部？如果三项均达标，进入下一阶段。
  integration_with_posture: 下肢训练是整个体态矫正的地基。骨盆位置决定脊柱排列 → 脊柱排列决定肩部位置 → 肩部位置决定头部位置 → 头部位置决定面部张力。如果骨盆前倾未解决，上肢和面部的矫正效果会大打折扣。
biomechanical_rationale:
  why_goblet_squat:
    reason: 高脚杯握法会自动激活核心，前置负荷会强制躯干直立，脚跟垫高会减少髋屈需求（降低髂腰肌参与），这三个机制共同创造了'骨盆后倾友好'的深蹲环境。
    alternative: 如果高脚杯深蹲仍感到下背部压力，改为箱式深蹲（坐至箱子再站起），进一步降低髋屈需求。
  why_bulgarian_split_squat:
    reason: 单侧训练会暴露左右不平衡（通常左侧较弱，因为久坐时左腿搭右腿）。后脚抬高会增加前侧腿负荷，同时挑战臀中肌稳定性（防止膝盖内扣）。这是纠正不平衡的最佳动作。
    common_finding: 90% 的人会发现左腿比右腿弱 10-20%。解决方案：弱侧多做 1 组，或使用更慢的节奏（下 4 秒-推 5 秒）。
  why_romanian_deadlift:
    reason: 罗马尼亚硬拉是唯一能同时强化腘绳肌 + 激活浅背线的动作。腘绳肌是股直肌的拮抗肌，强化腘绳肌会通过交互抑制原理减弱股直肌对骨盆的前拉力。同时，这个动作会激活浅背线（腘绳肌 → 臀大肌 → 竖脊肌 → 后背 → 枕骨下 → 额头），这是面部提升的核心机制。
    cue_emphasis: 全程想象'用屁股推'而非'用腰拉'。如果感到下背部发力，说明竖脊肌代偿，需降低重量并重新建立髋关节铰链模式。
  why_wall_sit:
    reason: 等长收缩会最大化肌肉耐力，同时不产生离心损伤（酸痛更少）。骨盆后倾锁定会训练核心在负重下的抗伸展能力，这是所有负重训练的安全基础。
    progression_path: 第 1-2 周：徒手 45 秒 → 第 3-4 周：徒手 60 秒 → 第 5-6 周：大腿上放 5kg 哑铃 45 秒 → 第 7-8 周：大腿上放 10kg 哑铃 45 秒。
  why_hip_abduction:
    reason: 臀中肌是膝关节稳定的守门员。如果臀中肌失活，深蹲时膝盖会内扣（膝外翻），这会增加 ACL（前交叉韧带）损伤风险。孤立强化臀中肌是预防膝盖损伤的最佳策略。
    assessment: 如果深蹲时膝盖内扣，说明臀中肌失活。解决方案：每次下肢训练前，先做 2 组蚌式开合 + 2 组髋外展（共 4 组），激活臀中肌。
common_compensation_patterns:
  pattern_1_lower_back_takeover:
    manifestation: 深蹲或硬拉时，下背部酸痛 > 臀腿
    root_cause: 骨盆前倾未锁定，竖脊肌代偿
    immediate_fix: 降低重量 50%，每次下蹲前先做 3 次骨盆后倾呼吸，建立神经连接
    long_term_solution: 每天执行体态矫正方案中的动作 1（髂腰肌抑制 + 臀大肌激活），持续 4 周
  pattern_2_knee_valgus:
    manifestation: 深蹲或分腿蹲时，膝盖向内倒
    root_cause: 臀中肌失活 + 内收肌过强
    immediate_fix: 弹力带套于膝盖上方，主动推膝盖向外对抗阻力
    long_term_solution: 每次下肢训练前，先做 3 组蚌式开合 + 3 组髋外展（共 6 组），持续 4 周
  pattern_3_forward_lean:
    manifestation: 深蹲时，躯干过度前倾（> 45°）
    root_cause: 踝关节活动度不足 + 髋屈肌紧张
    immediate_fix: 增加脚跟垫高至 4-5cm，或改为箱式深蹲
    long_term_solution: 每天执行小腿拉伸（靠墙弓步拉伸 2 组 × 45 秒/侧）+ 髂腰肌松解（3 分钟），持续 4 周
  pattern_4_butt_wink:
    manifestation: 深蹲至底部时，骨盆突然后倾（屁股眨眼）
    root_cause: 腘绳肌柔韧性不足 + 髋关节活动度受限
    immediate_fix: 减小下蹲深度至大腿平行地面（不低于平行）
    long_term_solution: 每天执行鸽式拉伸（2 组 × 60 秒/侧）+ 腘绳肌主动拉伸（2 组 × 45 秒/侧），持续 4 周
  pattern_5_heel_lift:
    manifestation: 深蹲时，脚跟离地
    root_cause: 踝关节背屈受限（小腿三头肌紧张）
    immediate_fix: 脚跟垫高 3-5cm，或改为高脚杯深蹲
    long_term_solution: 每天执行靠墙弓步拉伸（2 组 × 60 秒/侧）+ 小腿泡沫轴松解（3 分钟），持续 4 周
weekly_integration:
  monday_synergy:
    connection: 周一上肢推训练强调骨盆后倾锁定，为周二下肢训练建立神经模式
    carryover: 如果周一能在上斜卧推时保持骨盆后倾，周二深蹲时会更容易做到
  wednesday_synergy:
    connection: 周三核心训练会进一步强化骨盆后倾能力
    carryover: 周三的死虫式和鸟狗式会巩固周二建立的核心稳定性
  thursday_synergy:
    connection: 周四背部训练的硬拉动作会继续强化后链
    carryover: 周二的罗马尼亚硬拉为周四的传统硬拉打下基础
  cumulative_effect:
    week_1_2: 建立骨盆后倾的神经模式，可能感到'不自然'
    week_3_4: 骨盆后倾开始自动化，深蹲质量明显提升
    week_5_6: 骨盆后倾成为'默认模式'，日常站立时自动保持
    week_7_8: 骨盆中立化，脊柱排列改善，上肢和面部训练效果倍增
safety_protocols:
  red_flags:
    sharp_knee_pain:
      description: 深蹲或分腿蹲时，膝关节前侧或内侧尖锐疼痛
      action: 立即停止训练，冰敷 15 分钟，24 小时内就医
      prevention: 确保膝盖与脚尖同向，不内扣也不过度外展
    lower_back_pain:
      description: 深蹲或硬拉时，下背部尖锐疼痛或放射至臀部/腿部
      action: 立即停止训练，仰卧屈膝放松 10 分钟，48 小时内就医
      prevention: 降低重量 50%，重新建立骨盆后倾模式
    hip_impingement:
      description: 深蹲至底部时，髋前侧夹痛（髋关节撞击）
      action: 减小下蹲深度至大腿平行地面，如持续 > 3 次训练，就医评估
      prevention: 增加脚尖外展角度至 20-30°，改善髋关节活动度
  form_checkpoints:
    pre_set_checklist:
      - "[ ] 骨盆中立或微后倾"
      - "[ ] 肩胛骨后缩下沉（如适用）"
      - "[ ] 核心收紧（腹横肌激活）"
      - "[ ] 双脚稳定踩地，足弓激活"
      - "[ ] 呼吸模式准备（吸气下蹲，呼气推起）"
    mid_set_monitoring:
      - "[ ] 骨盆是否保持后倾？（每次下蹲前自查）"
      - "[ ] 膝盖是否与脚尖同向？（不内扣）"
      - "[ ] 躯干是否保持直立？（不过度前倾）"
      - "[ ] 脚跟是否始终贴地？（不抬起）"
      - "[ ] 呼吸是否顺畅？（不憋气）"
    post_set_assessment:
      - "[ ] 目标肌群（臀腿）酸痛 > 下背部？"
      - "[ ] 膝关节无不适？"
      - "[ ] 髋关节无夹痛？"
      - "[ ] 能否保持相同节奏完成下一组？"
      - "[ ] 如以上任一项为'否'，降低重量或休息更久"
  deload_protocol:
    when_to_deload: 如果连续 2 次训练感到下背部疲劳 > 臀腿，或膝关节持续不适
    deload_week_structure:
      volume: 减少至 2 组（而非 3-4 组）
      intensity: 重量降低至 60-70%
      tempo: 保持相同节奏（不加快）
      focus: 专注于动作质量和骨盆后倾，而非重量
    return_to_normal: Deload 周后，重量从 80% 开始，逐周增加 5-10%
nutrition_timing:
  pre_workout:
    timing: 训练前 90-120 分钟
    composition: 30-40g 复合碳水（燕麦/糙米/红薯）+ 15-20g 蛋白质
    rationale: 下肢训练需要更多糖原储备，复合碳水提供持续能量
  intra_workout:
    timing: 训练中（如训练 > 60 分钟）
    composition: 支链氨基酸（BCAA）5-10g + 电解质
    rationale: 防止肌肉分解，维持水合状态
  post_workout:
    timing: 训练后 30-60 分钟（黄金窗口）
    composition: 60g 快速碳水（白米饭/香蕉/运动饮料）+ 30g 蛋白质（乳清蛋白/鸡胸肉）
    rationale: 下肢肌群占全身肌肉 50%，需要更多碳水补充糖原，蛋白质启动修复
  evening:
    timing: 睡前 60-90 分钟
    composition: 酪蛋白 20-30g + 镁补剂 300mg
    rationale: 酪蛋白缓释，夜间持续供应氨基酸；镁促进肌肉放松和深度睡眠
recovery_optimization:
  immediate_post_workout:
    foam_rolling_sequence:
      - 1. 臀大肌（2 分钟/侧）：坐于滚轴上，单侧臀部压住，缓慢滚动
      - 2. 股四头肌（3 分钟）：俯卧，滚轴置于大腿前侧，前后滚动
      - 3. 腘绳肌（2 分钟/侧）：坐姿，滚轴置于大腿后侧，缓慢滚动
      - 4. 小腿（2 分钟/侧）：坐姿，滚轴置于小腿后侧，重点松解腓肠肌
      - 5. 髂腰肌（2 分钟/侧）：仰卧，滚轴置于髋前，定点松解
    static_stretching_sequence:
      - 1. 鸽式拉伸（60 秒/侧）：深层释放臀大肌
      - 2. 站姿股四头肌拉伸（45 秒/侧）：骨盆后倾锁定
      - 3. 腘绳肌主动拉伸（45 秒/侧）：弹力带辅助
      - 4. 髋屈肌拉伸（60 秒/侧）：半跪姿，骨盆后倾
      - 5. 小腿拉伸（45 秒/侧）：靠墙弓步拉伸
  evening_routine:
    contrast_therapy: 如有条件，冷热水交替浸泡下肢（冷水 2 分钟 - 热水 3 分钟，重复 3 次），促进血液循环和代谢废物清除
    compression: 穿着压缩裤 2-4 小时，减少肌肉震颤和炎症
    elevation: 睡前抬高双腿 15-20 分钟（高于心脏水平），促进静脉回流
  next_day_active_recovery:
    wednesday_focus: 周三核心训练会包含轻度下肢激活（如死虫式、鸟狗式），促进血液循环而不增加负荷
    walking: 轻松步行 20-30 分钟（心率 < 120 bpm），促进恢复
    avoid: 避免跑步、跳跃或任何高冲击活动
  sleep_optimization:
    target: 8-9 小时（下肢训练后需要更多睡眠）
    environment: 室温 18-20°C，完全黑暗，无电子设备
    supplements: 镁 300mg + 锌 15mg + 维生素 D3 2000 IU（睡前 60 分钟）
    rationale: 镁促进肌肉放松，锌支持睾酮合成，维生素 D3 支持骨骼健康
progress_tracking:
  weekly_measurements:
    performance_metrics:
      - 高脚杯深蹲：重量 × 次数（目标：每 2 周增加 2kg）
      - 保加利亚分腿蹲：左右腿重量差异（目标：4 周内差异 < 10%）
      - 罗马尼亚硬拉：重量 × 次数（目标：每 2 周增加 2-4kg）
      - 靠墙静蹲：保持时间（目标：每 2 周增加 5-10 秒）
    biomechanical_metrics:
      - 骨盆后倾测试：仰卧屈膝，下背部能否完全压向地面并保持 30 秒？
      - 膝盖稳定性测试：深蹲时膝盖是否与脚尖同向（不内扣）？
      - 髋关节活动度测试：深蹲能否达到大腿平行地面且不出现 butt wink？
      - 踝关节活动度测试：深蹲时脚跟是否始终贴地？
    visual_assessment:
      - 侧面照：骨盆位置（前倾角度是否减小？）
      - 正面照：膝盖位置（是否更对称，不内扣？）
      - 背面照：臀部形状（是否更饱满，不扁平？）
  monthly_reassessment:
    performance_goals:
      - 第 1 月：建立骨盆后倾的深蹲模式，重量次要
      - 第 2 月：在保持骨盆后倾的前提下，高脚杯深蹲重量增加 20-30%
      - 第 3 月：骨盆后倾自动化，日常站立时自动保持中立
    biomechanical_goals:
      - 第 1 月：能在无负重深蹲时保持骨盆后倾
      - 第 2 月：能在负重深蹲时保持骨盆后倾
      - 第 3 月：骨盆后倾成为'默认模式'，无需主动思考
    visual_goals:
      - 第 1 月：侧面照显示骨盆前倾角度减小 10-15%
      - 第 2 月：侧面照显示骨盆前倾角度减小 20-30%
      - 第 3 月：侧面照显示骨盆接近中立位置
