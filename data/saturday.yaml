id: module_a2_lower_chest_rear_delt_v1
version: 1
title: 模块 A2：下胸雕刻 + 肩后束立体化
type: strength_training
target_ratio: 下胸 40% | 肩后束 35% | 肩胛骨稳定 15% | 上胸维持 10%
duration: 60 分钟
recovery_interval: 48 小时（与周一模块 A1 间隔）
core_principle: 手肘内收 + 下压轨迹 + 肩胛骨后缩锁定 + 后束孤立
weekly_chest_volume_completion: 配合周一模块 A1（上胸 60%），完成下胸 40% 的精准分配，实现完整胸部发展
strategic_importance: 下胸是胸部轮廓的'收尾'，决定胸肌的'方正感'。肩后束是肩部立体度的关键，强化后束会创造'球形肩'的视觉效果。周六训练与周一间隔 5 天，确保充分恢复。
sections:
  warmup:
    - id: w1
      name: 泡沫轴松解胸大肌 - 释放周一残余紧张
      target: 胸大肌（尤其是外侧缘和下束）
      setup:
        - 俯卧于地面
        - ├─ 滚轴位置：置于腋窝前侧（胸大肌外侧缘）
        - ├─ 同侧手臂：向外展开 90°
        - ├─ 对侧手：支撑身体，控制压力
        - └─ 身体角度：略微向前倾（增加压力）
      cues:
        - "**核心机制：**"
        - "- 即使已经过去 5 天，胸肌深层可能仍有筋膜粘连"
        - "- **想象这是'清理'周一训练的'最后残留'**"
        - "- 胸肌紧张会限制肩胛骨后缩，影响今天的下胸训练质量"
        - ""
        - "**阶段 1：寻找痛点**"
        - "- 在腋窝前侧区域缓慢左右滚动（5cm 范围）"
        - "- **想象在'扫描'胸大肌外侧缘**"
        - "- 找到那个让你'想躲'的痛点"
        - ""
        - "**阶段 2：定点松解**"
        - "- 压住痛点不动，保持 20 秒"
        - "- **想象用滚轴'融化'这个紧张的肌肉**"
        - "- 配合深呼吸：吸气时肌肉紧张，呼气时肌肉放松"
      mistakes:
        - error: 位置过低
          manifestation: 按压到乳腺或肋骨
          fix: 向上移动至腋窝前侧（胸大肌外侧缘）
        - error: 压力不足
          manifestation: 无痛感
          fix: 增加身体前倾角度
      sets_reps: 2 分钟/侧
      tempo: 缓慢滚动 + 定点静止 20 秒
      muscle_feeling: 腋窝前侧深层酸痛，随后松绑感
      rest: 无
    - id: w2
      name: 肩袖外旋激活 - 稳定肩关节
      target: 冈下肌 + 小圆肌（肩袖后侧）
      setup:
        - 侧卧
        - ├─ 上侧手：持轻哑铃（2-3kg）
        - ├─ 手肘：贴近身体侧面
        - ├─ 前臂：自然下垂（起始位置）
        - └─ 头部：枕于下侧手臂或枕头
      cues:
        - "**核心机制：**"
        - "- 下胸训练时肩关节处于相对脆弱的位置（手臂下压）"
        - "- **想象这是'加固'肩关节的'保护层'**"
        - "- 肩袖激活是预防损伤的关键"
        - ""
        - "**外旋阶段（2 秒）：**"
        - "- 手肘贴近身体，前臂向上旋转至垂直位置"
        - "- **想象前臂是'门'，手肘是'铰链'**"
        - "- 感受肩关节后侧（冈下肌）收缩"
        - ""
        - "**顶峰静止（1 秒）：**"
        - "- 在最高点静止"
        - "- **想象用肩袖'锁定'肩关节**"
        - ""
        - "**回到起始（2 秒）：**"
        - "- 缓慢控制回放"
      mistakes:
        - error: 手肘离开身体
          manifestation: 手肘向外飘移
          fix: 手肘全程贴近身体侧面
        - error: 耸肩
          manifestation: 肩膀向耳朵靠拢
          fix: 主动下沉肩膀
        - error: 重量过大
          manifestation: 躯干旋转代偿
          fix: 降低重量至 2-3kg，专注于肩袖孤立
      sets_reps: 2 组 × 15 次/侧
      tempo: 外旋 2 秒-静止 1 秒-回 2 秒
      muscle_feeling: 肩关节后侧（冈下肌）轻度收缩感
      rest: 30 秒
    - id: w3
      name: 肩后束激活 - 建立神经连接
      target: 三角肌后束
      setup:
        - 俯身 60°
        - ├─ 双手：持轻哑铃（2-3kg）自然下垂
        - ├─ 膝盖：微屈
        - ├─ 脊柱：中立，骨盆后倾
        - └─ 视线：向下（保持颈部中立）
      cues:
        - "**核心机制：**"
        - "- 肩后束是整个模块的关键肌群"
        - "- **想象这是'唤醒'肩后束，建立神经-肌肉连接**"
        - ""
        - "**上举阶段（2 秒）：**"
        - "- 手臂向两侧抬起至肩高"
        - "- 小指侧略高于大拇指侧（旋后）"
        - "- **想象手臂是'翅膀'，向两侧展开**"
        - "- 感受肩后束（肩膀后侧）收缩"
        - ""
        - "**顶峰静止（2 秒）：**"
        - "- 在肩高位置静止"
        - "- **想象用肩后束'夹'住肩胛骨**"
        - ""
        - "**下放阶段（2 秒）：**"
        - "- 缓慢控制下降"
      mistakes:
        - error: 耸肩（斜方肌上束代偿）
          manifestation: 肩膀向耳朵靠拢
          fix: 主动下沉肩膀，想象'肩膀远离耳朵'
        - error: 手臂抬起过高
          manifestation: 手臂超过肩高
          fix: 限制高度在肩高，避免斜方肌代偿
        - error: 躯干摆动
          manifestation: 借助惯性
          fix: 降低重量，保持躯干稳定
      sets_reps: 2 组 × 15 次
      tempo: 上 2 秒-静止 2 秒-下 2 秒
      muscle_feeling: 肩膀后侧（三角肌后束）轻度收缩感
      rest: 30 秒
    - id: w4
      name: 肩胛骨后缩下沉激活 - YTW 序列
      target: 菱形肌 + 中下斜方肌 + 肩袖
      setup:
        - 俯卧于地面或卧推凳
        - ├─ 额头：贴地或贴凳
        - ├─ 双臂：自然下垂（准备移动）
        - ├─ 骨盆：后倾锁定
        - └─ 呼吸：保持自然
      cues:
        - "**核心机制：**"
        - "- 下胸训练时肩胛骨必须锁定（后缩下沉）"
        - "- **想象这是'锁定'肩胛骨的'螺栓'**"
        - "- 如果肩胛骨未锁定，会导致肩部前移和受伤"
        - ""
        - "**Y 字（8 次）：**"
        - "- 双臂向斜上方 45° 抬起，大拇指朝上"
        - "- **想象双臂是'指针'，指向 10 点和 2 点方向**"
        - "- 保持 2 秒，感受中下斜方肌收缩"
        - ""
        - "**T 字（8 次）：**"
        - "- 双臂向正侧方 90° 抬起，大拇指朝上"
        - "- **想象双臂是'飞机翅膀'，向两侧展开**"
        - "- 保持 2 秒，感受菱形肌和中斜方肌收缩"
        - ""
        - "**W 字（8 次）：**"
        - "- 手肘屈曲，向后拉（形成 W 字）"
        - "- **想象用手肘'拉'肩胛骨向脊柱靠拢**"
        - "- 肩胛骨后缩，保持 2 秒，感受菱形肌强烈收缩"
      mistakes:
        - error: 耸肩
          manifestation: 肩膀向耳朵靠拢
          fix: 主动下沉肩膀，想象'肩膀远离耳朵'
        - error: 手臂抬起过高
          manifestation: 手臂超过肩高
          fix: 限制高度在肩高
      sets_reps: 2 组 × 8 次（Y-T-W 各 8 次）
      tempo: 上 2 秒-保持 2 秒-下 2 秒
      muscle_feeling: 肩胛骨中间（菱形肌）+ 后颈下方（中下斜方肌）轻度收缩感
      rest: 30 秒
    - id: w5
      name: 骨盆后倾呼吸 - 核心预激活
      target: 核心稳定性（腹横肌 + 下腹肌）
      setup:
        - 仰卧屈膝
        - ├─ 双脚：踩地，与髋同宽
        - ├─ 双手：置于体侧或腹部
        - └─ 脊柱：中立（准备移动）
      cues:
        - "**核心机制：**"
        - "- 所有卧推类动作都需要核心稳定"
        - "- **想象这是'锁定'核心，为卧推建立稳定平台**"
        - "- 骨盆后倾可以防止下背部过度伸展（塌腰），保护腰椎"
        - ""
        - "**吸气阶段（3 秒）：**"
        - "- 鼻吸气，腹部隆起"
        - "- **想象腹部是'气球'，向四面八方充气**"
        - ""
        - "**呼气阶段（5 秒）：**"
        - "- 口呼气，主动收缩下腹肌"
        - "- 骨盆后倾，下背部压向地面"
        - "- **想象用下腹肌'拉'骨盆向上卷**"
        - "- 感受下背部完全贴地"
      mistakes:
        - error: 下背部未贴地
          manifestation: 下背部与地面有空隙
          fix: 增加下腹肌收缩力度，主动压下背部
        - error: 臀部抬起
          manifestation: 骨盆后倾过度
          fix: 只需下背部贴地，臀部保持贴地
      sets_reps: 10 次深呼吸
      tempo: 吸 3 秒-呼 5 秒
      muscle_feeling: 下腹肌轻度收缩感 + 下背部贴地感
      rest: 无
  strength:
    - id: s1
      name: 双杠臂屈伸（身体前倾 30°）- 下胸核心动作
      target: 胸大肌下束（主导）+ 肱三头肌（辅助）
      setup:
        - 双手握杠，身体悬空
        - ├─ 身体前倾：30°（这是关键角度）
        - ├─ 手肘：指向身体后方（而非正侧方）
        - ├─ 肩胛骨：后缩下沉并锁定
        - └─ 双腿：自然下垂或屈膝（保持稳定）
      cues:
        - "**核心机制：**"
        - "- 身体前倾角度决定下胸参与度"
        - "- **想象这是'雕刻'下胸的'手术刀'**"
        - "- 前倾 30° = 下胸主导，直立 = 肱三头肌主导"
        - ""
        - "**下降阶段（3 秒）：**"
        - "- 手肘弯曲，身体下降"
        - "- 下降至肩关节略低于肘关节（但不过度拉伸）"
        - "- **想象胸部向下'沉'**"
        - "- 感受胸大肌下部强烈拉伸"
        - "- 身体前倾角度保持 30°（不变）"
        - ""
        - "**顶峰拉伸（2 秒）：**"
        - "- 在最低点静止"
        - "- **想象下胸像橡皮筋一样被拉到极限**"
        - "- 拉伸强度：感受胸部下缘深层牵拉（疼痛 6-7/10）"
        - ""
        - "**推起阶段（4 秒）：**"
        - "- 用胸大肌下部主动推起（而非肱三头肌）"
        - "- **想象用下胸'推'身体向上**"
        - "- 身体前倾角度保持 30°"
        - ""
        - "**顶峰挤压（1 秒）：**"
        - "- 在最高点手肘不锁死"
        - "- **想象用下胸'夹'住胸骨**"
      mistakes:
        - error: 身体直立（肱三头肌代偿）
          manifestation: 感觉手臂后侧发力 > 胸部
          fix: 增加身体前倾至 30-40°
        - error: 肩部前移（肩胛骨未锁定）
          manifestation: 肩膀向前'滚'
          fix: 肩胛骨后缩下沉并锁定，想象'胸部挺出'
        - error: 下降过深
          manifestation: 肩关节前侧疼痛
          fix: 限制下降深度至肩关节略低于肘关节
        - error: 无法完成 8 次
          manifestation: 力量不足
          fix: 使用弹力带辅助，或改为上斜俯卧撑（脚垫高）
      sets_reps: 4 组 × 8 次
      tempo: 下 3 秒-拉伸 2 秒-推 4 秒-挤 1 秒
      muscle_feeling: 胸部下缘（乳头下方 5cm）深层酸胀和充血
      rest: 90 秒
      weight_selection:
        method: 自重。如无法完成 8 次，使用弹力带辅助；如能轻松完成 12 次，在腰部挂重物
        progression: 每 2 周评估：能否减少弹力带辅助或增加负重？
      progression:
        - 第 1-2 周：建立身体前倾 30° 的神经模式
        - 第 3-4 周：在保持节奏的前提下，减少弹力带辅助或增加负重 2-5kg
        - 第 5-8 周：引入顶峰收缩强化（挤压 2 秒而非 1 秒）
    - id: s2
      name: 下斜哑铃卧推（-15°）- 下胸厚度
      target: 胸大肌下束（厚度）
      setup:
        - 卧推凳调至 -15°（头部低于臀部）
        - ├─ 双脚：勾住固定物稳定身体
        - ├─ 双手：持哑铃于胸部下方，掌心相对（中立握）
        - ├─ 肩胛骨：后缩下沉并锁定
        - └─ 骨盆：后倾锁定
      cues:
        - "**核心机制：**"
        - "- 下斜角度和重力方向强制下胸承担更多负荷"
        - "- **想象这是'增厚'下胸的关键动作**"
        - "- 手肘内收 45° 是孤立下胸的关键"
        - ""
        - "**下放阶段（3 秒）：**"
        - "- 手肘内收 45°（而非 90° 外展）"
        - "- **想象手肘沿着身体侧面向下滑**"
        - "- 哑铃降至胸部下缘（乳头下方 5cm）"
        - "- 感受下胸拉伸"
        - ""
        - "**顶峰拉伸（2 秒）：**"
        - "- 在最低点静止"
        - "- **想象下胸被哑铃'拉'到极限**"
        - ""
        - "**推起阶段（4 秒）：**"
        - "- 用下胸主动推起"
        - "- **想象用下胸'推'哑铃向上**"
        - "- 手肘不锁死"
        - ""
        - "**顶峰挤压（1 秒）：**"
        - "- 在顶端旋腕内扣"
        - "- **想象用下胸'夹'住哑铃**"
      mistakes:
        - error: 下斜角度过大
          manifestation: 头部充血不适
          fix: 限制下斜角度在 -15° 至 -20°
        - error: 手肘外展 90°（前束三角肌代偿）
          manifestation: 感觉肩膀前侧发力 > 胸部
          fix: 手肘内收至 45°
        - error: 肩胛骨未锁定
          manifestation: 肩膀向前'滚'
          fix: 肩胛骨后缩下沉并锁定
      sets_reps: 3 组 × 10 次
      tempo: 下 3 秒-拉伸 2 秒-推 4 秒-挤 1 秒
      muscle_feeling: 胸部下缘深层酸胀
      rest: 75 秒
      weight_selection:
        method: 能严格保持手肘内收 45° 完成 10 次，RIR = 1-2
        first_time_estimate: 体重 62kg，建议单只哑铃 8-14kg
        progression: 每 2 周评估：能否增加 2kg 且保持节奏？
    - id: s3
      name: 下斜俯卧撑（脚垫高 30-40cm）- 下胸耐力
      target: 胸大肌下束（耐力 + 代谢压力）
      setup:
        - 双脚置于卧推凳或椅子上（高度 30-40cm）
        - ├─ 双手：与肩同宽撑地
        - ├─ 身体：成一直线
        - ├─ 骨盆：后倾锁定
        - └─ 核心：收紧
      cues:
        - "**核心机制：**"
        - "- 高次数耐力训练增加下胸的代谢压力（泵感）"
        - "- **想象这是'泵'满下胸的动作**"
        - "- 促进肌浆增生（肌肉饱满度）"
        - ""
        - "**下降阶段（3 秒）：**"
        - "- 手肘内收 45°"
        - "- 胸部降至距地面 5cm"
        - "- **想象胸部向地面'沉'**"
        - "- 感受下胸拉伸"
        - ""
        - "**顶峰拉伸（1 秒）：**"
        - "- 在最低点静止"
        - ""
        - "**推起阶段（3 秒）：**"
        - "- 用下胸主动推起"
        - "- 手肘不锁死"
        - ""
        - "**顶峰挤压（1 秒）：**"
        - "- 在最高点挤压下胸"
      mistakes:
        - error: 塌腰（核心失活）
          manifestation: 下背部过度拱起
          fix: 骨盆后倾锁定，核心收紧。如仍塌腰，立即停止
        - error: 臀部抬起
          manifestation: 身体形成'倒 V'
          fix: 保持身体成一直线
        - error: 手肘外展
          manifestation: 手肘指向正侧方
          fix: 手肘内收 45°
      sets_reps: 3 组 × 12-15 次
      tempo: 下 3 秒-拉伸 1 秒-推 3 秒-挤 1 秒
      muscle_feeling: 下胸强烈泵感（充血感）
      rest: 60 秒
      progression:
        - 第 1-2 周：自重完成 12-15 次
        - 第 3-4 周：在背部放置轻重物（书包 + 2-5kg 哑铃）
        - 第 5-8 周：增加负重至 5-10kg
    - id: s4
      name: 地板卧推 - 上胸维持
      target: 胸大肌上束（维持性训练 10%）
      setup:
        - 仰卧于地板
        - ├─ 双脚：踩地，骨盆后倾
        - ├─ 肩胛骨：后缩下沉并锁定
        - ├─ 双手：持哑铃，掌心向前
        - └─ 手肘：准备下放
      cues:
        - "**核心机制：**"
        - "- 这是上胸的维持性训练（10% 容量）"
        - "- **想象这是'保持'上胸的神经-肌肉连接**"
        - "- 通过地板限制 ROM，强制上胸发力"
        - ""
        - "**下放阶段（3 秒）：**"
        - "- 手肘触地即停止（ROM 受限）"
        - "- **想象地板是'安全网'**"
        - ""
        - "**顶峰静止（2 秒）：**"
        - "- 手肘触地时静止"
        - ""
        - "**推起阶段（3 秒）：**"
        - "- 用上胸主动推起"
        - "- 手肘不锁死"
      mistakes:
        - error: 手肘未触地
          manifestation: ROM 过小
          fix: 确保手肘完全触地
      sets_reps: 2 组 × 12 次
      tempo: 下 3 秒-静止 2 秒-推 3 秒
      muscle_feeling: 上胸轻度收缩感（而非疲劳）
      rest: 60 秒
    - id: s5
      name: 俯身哑铃侧平举 - 肩后束孤立
      target: 三角肌后束（孤立）
      setup:
        - 俯身 60-70°
        - ├─ 双手：持哑铃自然下垂，掌心相对
        - ├─ 膝盖：微屈
        - ├─ 脊柱：中立，骨盆后倾
        - └─ 视线：向下
      cues:
        - "**核心机制：**"
        - "- 俯身角度 60-70° 会最大化肩后束参与"
        - "- **想象这是'雕刻'肩后束的精准动作**"
        - ""
        - "**上举阶段（2 秒）：**"
        - "- 手臂向两侧抬起至肩高"
        - "- 小指侧略高于大拇指侧（旋后）"
        - "- **想象手臂是'翅膀'，向两侧展开**"
        - "- 感受肩后束收缩"
        - ""
        - "**顶峰挤压（2 秒）：**"
        - "- 在肩高位置静止"
        - "- **想象用肩后束'夹'住肩胛骨**"
        - ""
        - "**下放阶段（3 秒）：**"
        - "- 极度缓慢地控制下降"
        - "- **想象对抗一个向下拉的重力**"
      mistakes:
        - error: 耸肩（斜方肌上束代偿）
          manifestation: 肩膀向耳朵靠拢
          fix: 主动下沉肩膀，降低重量 30%
        - error: 手臂抬起过高
          manifestation: 手臂超过肩高
          fix: 限制高度在肩高
        - error: 躯干摆动
          manifestation: 借助惯性
          fix: 降低重量，保持躯干稳定
      sets_reps: 4 组 × 12 次
      tempo: 上 2 秒-挤 2 秒-下 3 秒
      muscle_feeling: 肩膀后侧深层酸胀和充血
      rest: 60 秒
      weight_selection:
        method: 能严格保持肩膀下沉完成 12 次，RIR = 2
        first_time_estimate: 体重 62kg，建议单只哑铃 3-6kg
        progression: 每 2 周评估：能否增加 1kg 且保持肩膀下沉？
    - id: s6
      name: 反向飞鸟（胸部支撑）- 肩后束 + 菱形肌整合
      target: 三角肌后束 + 菱形肌 + 中下斜方肌
      setup:
        - 胸部贴于 45° 卧推凳
        - ├─ 双脚：踩地稳定
        - ├─ 双手：持轻哑铃（3-5kg）自然下垂，掌心相对
        - └─ 肩胛骨：起始位置前伸
      cues:
        - "**核心机制：**"
        - "- 胸部支撑消除下背部代偿，孤立肩后束"
        - "- **想象这是'精雕'肩后束的动作**"
        - ""
        - "**上举阶段（2 秒）：**"
        - "- 肩胛骨先动（后缩下沉）"
        - "- 然后手臂向两侧抬起至肩高"
        - "- **想象用肩胛骨'拉'手臂向上**"
        - ""
        - "**顶峰挤压（3 秒）：**"
        - "- 在最高点静止"
        - "- **想象用肩后束和菱形肌'夹'住肩胛骨**"
        - ""
        - "**下放阶段（3 秒）：**"
        - "- 控制下降"
      mistakes:
        - error: 胸部离开凳面
          manifestation: 躯干抬起
          fix: 降低重量，胸部全程贴紧凳面
        - error: 耸肩
          manifestation: 肩膀向耳朵靠拢
          fix: 主动下沉肩膀
      sets_reps: 3 组 × 15 次
      tempo: 上 2 秒-挤 3 秒-下 3 秒
      muscle_feeling: 肩后束 + 肩胛骨中间深层酸胀
      rest: 60 秒
    - id: s7
      name: 俯卧 W 字上举（整合版）- 肩后束 + 肩胛骨稳定
      target: 三角肌后束 + 菱形肌 + 中下斜方肌（整合性训练）
      setup:
        - 俯卧于地面
        - ├─ 额头：贴地或垫毛巾
        - ├─ 双臂：向前伸展成 Y 字
        - ├─ 掌心：向下
        - └─ 骨盆：后倾锁定
      cues:
        - "**核心机制：**"
        - "- 这是肩后束训练的'收尾整合'动作"
        - "- **想象这是'巩固'今天所有肩后束训练的神经连接**"
        - "- 在疲劳状态下，专注于肩胛骨控制（而非负荷）"
        - ""
        - "**W 字收缩（2 秒）：**"
        - "- 双臂从 Y 字向 W 字收缩"
        - "- **想象手肘向后拉，同时向身体两侧靠拢**"
        - "- 手肘弯曲至 90°，大拇指朝上"
        - "- 肩胛骨后缩下沉"
        - "- **想象用肩胛骨中间'夹'住一支笔**"
        - "- 感受肩后束 + 菱形肌 + 中下斜方肌共同收缩"
        - ""
        - "**顶峰挤压（2 秒）：**"
        - "- 在 W 字位置静止"
        - "- **想象用肩后束和菱形肌'挤压'肩胛骨**"
        - "- 这是整合今天所有肩后束训练的关键时刻"
        - "- 感受后颈下方和肩膀后侧深层收缩"
        - ""
        - "**回到 Y 字（3 秒）：**"
        - "- 极度缓慢地回到起始位置"
        - "- **想象对抗一个向前拉的阻力**"
        - "- 保持肩胛骨控制（不完全放松）"
      mistakes:
        - error: 耸肩（斜方肌上束代偿）
          manifestation: 肩膀向耳朵靠拢（疲劳状态下更容易发生）
          fix: 主动下沉肩膀，想象'肩膀远离耳朵'。如仍耸肩，立即停止
        - error: 下背部代偿
          manifestation: 腰椎过度拱起
          fix: 骨盆后倾锁定，核心收紧。如仍塌腰，立即停止
        - error: 动作幅度过小
          manifestation: W 字不明显（疲劳导致）
          fix: 降低次数至 15 次，专注于完整 ROM
        - error: 速度过快
          manifestation: 借助惯性（疲劳时常见）
          fix: 延长每次动作至 7 秒（W 字 2 秒 - 挤压 2 秒 - 回 Y 字 3 秒）
      sets_reps: 3 组 × 20 次
      tempo: W 字收缩 2 秒 - 挤压 2 秒 - 回 Y 字 3 秒
      muscle_feeling: 肩后束 + 肩胛骨中间（菱形肌）+ 后颈下方（中下斜方肌）轻度收缩感（而非疲劳）
      rest: 60 秒
      weight_selection:
        method: 徒手版本。如果前面的肩后束训练强度足够，徒手即可达到整合效果
        progression: 第 1-4 周：徒手版本。第 5-8 周：如果能轻松完成 20 次，双手各持 500ml 水瓶
      progression:
        - 第 1-2 周：徒手版本，建立肩后束 + 肩胛骨的整合模式
        - 第 3-4 周：能在疲劳状态下完成 20 次且无耸肩
        - 第 5-8 周：如能轻松完成，双手各持 500ml 水瓶（增加轻度阻力）
      strategic_positioning: 这是周六训练的'收尾'动作，目标是整合今天所有肩后束训练的神经连接，同时为周一上肢推训练建立肩胛骨稳定性。在疲劳状态下，专注于质量（肩胛骨控制）而非数量（负荷）。
  stretch:
    - id: st1
      name: 门框胸肌拉伸 - 释放下胸紧张
      target: 胸大肌（尤其是下束）
      setup:
        - 站于门框内
        - ├─ 一侧手臂：置于门框上，手肘低于肩高（拉伸下胸）
        - ├─ 身体：向前跨步
        - └─ 对侧手：置于体侧
      cues:
        - "**阶段 1：建立拉伸位置**"
        - "- 一侧手臂置于门框上，手肘低于肩高"
        - "- **想象手被'粘'在门框上**"
        - ""
        - "**阶段 2：身体前跨**"
        - "- 身体向前跨步"
        - "- **想象胸部被门框向外'拉'开**"
        - "- 感受同侧胸部下缘拉伸"
        - ""
        - "**阶段 3：呼吸加深**"
        - "- 保持拉伸位置，进行 3 次深呼吸"
        - "- 每次呼气时，身体向前多跨 1-2mm"
      mistakes:
        - error: 肩膀耸起
          manifestation: 肩膀向耳朵靠拢
          fix: 主动下沉肩膀
        - error: 过度拉伸
          manifestation: 肩关节疼痛（> 6/10）
          fix: 减小身体前跨幅度
      sets_reps: 2 组 × 30 秒/侧
      tempo: 静态保持 + 深呼吸
      muscle_feeling: 胸部下缘轻度拉伸感
      rest: 无
    - id: st2
      name: 肩后束拉伸 - 释放训练后紧张
      target: 三角肌后束
      setup:
        - 站姿或坐姿
        - ├─ 一侧手臂：水平伸直于胸前
        - ├─ 对侧手：拉住该手臂肘部
        - └─ 躯干：保持正直
      cues:
        - "**阶段 1：建立拉伸位置**"
        - "- 一侧手臂水平伸直于胸前"
        - "- 对侧手拉住该手臂肘部"
        - ""
        - "**阶段 2：向对侧拉**"
        - "- 对侧手将该手臂向对侧拉"
        - "- **想象肩后束被'拉'开**"
        - "- 感受肩膀后侧拉伸"
        - ""
        - "**阶段 3：保持与呼吸**"
        - "- 保持 30 秒"
        - "- 进行 3 次深呼吸"
      mistakes:
        - error: 躯干旋转
          manifestation: 身体向拉伸侧旋转
          fix: 保持躯干正直
      sets_reps: 2 组 × 30 秒/侧
      tempo: 静态保持 + 深呼吸
      muscle_feeling: 肩膀后侧轻度拉伸感
      rest: 无
    - id: st3
      name: 婴儿式 - 全身放松
      target: 全脊柱 + 肩关节
      setup:
        - 跪姿
        - ├─ 臀部：坐于脚跟上
        - ├─ 双臂：向前伸展
        - └─ 额头：贴地
      cues:
        - "**阶段 1：建立姿势**"
        - "- 臀部坐于脚跟，双臂向前伸展"
        - "- **想象身体向前'融化'**"
        - ""
        - "**阶段 2：呼吸放松**"
        - "- 进行 6 次深呼吸"
        - "- 每次呼气时，身体向前延伸 1-2mm"
      sets_reps: 2 分钟
      tempo: 静态保持 + 深呼吸
      muscle_feeling: 全身深层放松感
      rest: 无
post_workout_notes:
  soreness_prediction: 预期酸痛部位：下胸（24-48 小时，最强烈）、肩后束（36-60 小时）、肱三头肌（12-24 小时，轻度）。如果上胸酸痛 > 下胸，说明动作选择或角度错误。
  recovery_protocol: 训练后 2 小时内摄入 40g 碳水 + 25g 蛋白质。今晚进行 15 分钟泡沫轴松解（重点：胸大肌、肩后束）。明天（周日）完全休息。
  weekly_chest_assessment: 周六训练后，评估本周胸部训练总量：周一上胸 60% + 周六下胸 40% = 100%。如果下胸酸痛 < 上胸，下周增加双杠臂屈伸至 5 组。
  progression_strategy: 每 2 周评估：(1) 双杠臂屈伸能否减少弹力带辅助或增加负重？(2) 俯身侧平举时是否能清晰感受肩后束收缩？(3) 下胸酸痛是否 > 肱三头肌？如果三项均达标，进入下一阶段。
biomechanical_rationale:
  why_dips_for_lower_chest:
    reason: 双杠臂屈伸通过身体前倾 30° 和自重负荷，最大化下胸参与。下降时的深层拉伸会激活更多肌纤维，推起时的强力收缩会促进肌肉肥大。
    cue_emphasis: 全程想象'用下胸推'而非'用手臂推'。如果感到手臂发力 > 胸部，增加身体前倾至 40°。
  why_decline_press:
    reason: 下斜角度改变重力方向，强制下胸承担更多负荷。中立握（掌心相对）会减少肩关节压力，同时增加下胸参与。
    alternative: 如果无下斜卧推凳，改为下斜俯卧撑（脚垫高）。
  why_bent_over_lateral_raise:
    reason: 俯身 60-70° 会将重力方向与肩后束纤维方向对齐，最大化肩后束参与。旋后（小指侧略高）会进一步孤立肩后束，减少斜方肌代偿。
    weight_selection: 这是孤立小肌群的动作，重量必须轻（3-6kg）。如果重量过大，斜方肌上束会代偿，失去孤立效果。
weekly_integration:
  monday_connection:
    carryover: 周一上胸训练（60%）+ 周六下胸训练（40%）= 完整胸部发展
    synergy: 周一的肩胛骨后缩下沉锁定为周六下胸训练建立了神经模式
  rest_day_sunday:
    importance: 周日必须完全休息。周六下胸训练后，胸肌需要 48-72 小时恢复。
    active_recovery: 周日可执行轻度瑜伽或步行（心率 < 120 bpm），促进血液循环
  cumulative_effect:
    week_1_2: 建立下胸和肩后束的神经-肌肉连接
    week_3_4: 下胸轮廓开始显现，肩后束开始'鼓起'
    week_5_6: 胸部方正感增强，肩部立体度提升
    week_7_8: 下胸和肩后束发展成熟，整体上肢视觉效果显著改善
safety_protocols:
  red_flags:
    shoulder_pain_during_dips:
      description: 双杠臂屈伸时，肩关节前侧尖锐疼痛
      action: 立即停止训练，冰敷 15 分钟，48 小时内就医
      prevention: 限制下降深度至肩关节略低于肘关节，确保肩胛骨后缩下沉
    chest_strain:
      description: 下胸训练时，胸部撕裂感或剧烈疼痛
      action: 立即停止训练，冰敷 15 分钟，48 小时内就医
      prevention: 降低重量 30%，严格控制离心阶段速度
  form_checkpoints:
    pre_set_checklist:
      - "[ ] 肩胛骨后缩下沉（不耸肩）"
      - "[ ] 骨盆后倾锁定（不塌腰）"
      - "[ ] 核心收紧（腹横肌激活）"
      - "[ ] 呼吸模式准备（不憋气）"
    mid_set_monitoring:
      - "[ ] 肩胛骨是否锁定？（每次动作自查）"
      - "[ ] 是否感到目标肌群（下胸/肩后束）发力？"
      - "[ ] 呼吸是否顺畅？（不憋气）"
      - "[ ] 肩关节是否无不适？"
    post_set_assessment:
      - "[ ] 下胸酸痛 > 手臂或肩膀前侧？"
      - "[ ] 肩后束酸痛 > 斜方肌上束？"
      - "[ ] 肩关节无不适？"
      - "[ ] 能否保持相同节奏完成下一组？"
nutrition_timing:
  pre_workout:
    timing: 训练前 90-120 分钟
    composition: 30-40g 复合碳水 + 15-20g 蛋白质
    rationale: 下胸和肩后束训练需要充足能量储备
  post_workout:
    timing: 训练后 30-60 分钟
    composition: 40g 快速碳水 + 25g 蛋白质
    rationale: 补充糖原，启动肌肉修复
recovery_optimization:
  immediate_post_workout:
    foam_rolling_sequence:
      - 1. 胸大肌（3 分钟/侧）：俯卧滚动，重点松解下胸
      - 2. 肩后束（2 分钟/侧）：侧卧滚动，释放肩后束紧张
      - 3. 肱三头肌（2 分钟/侧）：侧卧滚动
    static_stretching_sequence:
      - 1. 门框胸肌拉伸（30 秒/侧）：释放下胸
      - 2. 肩后束拉伸（30 秒/侧）：释放肩后束
      - 3. 婴儿式（60 秒）：全身放松
progress_tracking:
  weekly_measurements:
    performance_metrics:
      - 双杠臂屈伸：次数（目标：每 2 周增加 1-2 次或减少弹力带辅助）
      - 下斜哑铃卧推：重量 × 次数（目标：每 2 周增加 2kg）
      - 俯身侧平举：能否清晰感受肩后束收缩？
    visual_assessment:
      - 正面照：下胸轮廓（是否更方正？）
      - 侧面照：胸部厚度（是否更饱满？）
      - 后面照：肩后束（是否更'鼓起'？）
mindset_and_execution:
  mental_approach:
    quality_over_quantity: 下胸和肩后束是小肌群，重质不重量。宁可做 8 次完美的双杠臂屈伸（身体前倾 30°），也不要做 15 次糟糕的（直立）。
    mind_muscle_connection: 每次动作前，用手触摸目标肌群（下胸、肩后束），建立触觉反馈。
    patience_with_progression: 下胸和肩后束的发展需要 6-8 周。不要急于增加负荷。
  execution_mantras:
    before_each_set: 肩胛骨锁定，身体前倾 30°（双杠臂屈伸），肩膀下沉（肩后束训练）。
    during_movement: 极度缓慢，消除惯性，感受目标肌群收缩。
    at_peak_contraction: 挤压，挤压，再挤压。
    when_fatigued: 当感到无法坚持时，再坚持 2 次。
