<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Steve Zim Physique</title>
    <!-- Google Fonts: Noto Sans SC & Noto Serif SC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/pwa-icon-512.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <!-- Adaptive theme colors for iOS PWA Status Bar -->
    <meta name="theme-color" content="#fbf9f6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1f26" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>

<body class="bg-surface text-ink min-h-screen font-sans antialiased">
    <!-- PWA Bottom Terminal Coda spacing ensures we don't clip at the very bottom -->
    <div class="pb-[160px]">
        <!-- Header -->
        <header class="fixed top-0 w-full bg-surface/90 backdrop-blur z-50 border-b border-subtle-border safe-area-top">
            <div class="max-w-[896px] mx-auto px-6 h-16 flex items-center justify-between">
                <h1 class="text-xl font-serif font-bold tracking-tight text-ink cursor-pointer flex items-baseline gap-2" onclick="app.goHome()">
                    Zim<span class="text-accent text-sm tracking-wider font-sans uppercase">Physique</span>
                </h1>
                <div id="header-actions" class="flex gap-4">
                    <!-- Actions injected via JS -->
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main id="app-container" class="max-w-[896px] mx-auto px-6 pt-24 safe-area-bottom">
            <!-- Views rendered here -->
        </main>
    </div>

    <!-- Audio for Timer -->
    <audio id="timer-beep" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- Scripts -->
    <script type="module" src="./app.js"></script>
</body>

</html>
