<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ZimPhysique Training</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#f59e0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body class="bg-gray-50 text-slate-900 min-h-screen font-sans antialiased pb-20">

    <!-- Header -->
    <header class="fixed top-0 w-full bg-white/95 backdrop-blur z-50 border-b border-gray-200 shadow-sm safe-area-top">
        <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-xl font-bold tracking-tight text-slate-900 cursor-pointer" onclick="app.goHome()">
                Zim<span class="text-accent">Physique</span>
            </h1>
            <div id="header-actions" class="flex gap-4">
                <!-- Actions injected via JS -->
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="app-container" class="max-w-md mx-auto px-4 pt-20 safe-area-bottom">
        <!-- Views rendered here -->
    </main>

    <!-- Audio for Timer -->
    <audio id="timer-beep" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"
        preload="auto"></audio>

    <!-- Scripts -->
    <script type="module" src="./app.js"></script>
    <script>
        // PWA Plugin handles SW registration automatically but we can keep minimal logic if desired
        // For now, removing manual registration as vite-plugin-pwa usually injects its own logic
        // or we rely on the plugin's virtual module in app.js
    </script>
</body>

</html>
